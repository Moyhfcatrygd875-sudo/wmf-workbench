<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>网络自检 v3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px;line-height:1.7}
h1{font-size:20px;margin:0 0 16px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #334155}
.row:last-child{border-bottom:none}
.status{font-weight:700;font-size:14px}
.ok{color:#22c55e}.bad{color:#ef4444}.wait{color:#f59e0b}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;background:#2563eb;color:#fff;margin-top:8px}
.small{font-size:12px;color:#94a3b8;margin-top:8px}
code{background:#0f172a;padding:2px 6px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<h1>🔍 网络自检 v3（关键：真实注册测试）</h1>
<div class="card" id="version">版本检测…</div>
<div class="card" id="sb">Supabase 检测…</div>
<button class="btn" onclick="runTest()">🔄 重新检测</button>
<div class="small">此页面会向 Supabase 发起一次<b>真实注册请求</b>（用随机邮箱），测试手机到 Supabase 的完整链路。<br>
如果下方显示红色“注册请求超时/失败”，说明你的网络/浏览器无法访问 Supabase → 云同步版必然卡住。<br>
如果显示绿色“注册成功”，说明网络通 → 那是工作台页面缓存问题，需强制刷新。</div>

<script>
var VERSION='DIAG-20260817-3';
var URL='https://oxlkjkmpmzzncezrbkua.supabase.co';
var KEY='sb_publishable_qscJeObo-S1uRIY4u6eNBw_J2LvDYxA';
function $(id){return document.getElementById(id)}
function addRow(container,label,state,msg){
  var d=document.createElement('div');d.className='row';
  d.innerHTML='<span>'+label+'</span><span class="status '+state+'">'+msg+'</span>';
  $(container).appendChild(d);
}
function runTest(){
  $('version').innerHTML='';
  addRow('version','页面版本','ok',VERSION);
  addRow('version','当前域名','ok',location.host);

  $('sb').innerHTML='';
  // 1) 健康检查
  addRow('sb','步骤1 健康检查','wait','检测中…');
  var t1=setTimeout(function(){var r=$('sb').querySelector('.row');if(r)r.innerHTML='<span>步骤1 健康检查</span><span class="status bad">超时</span>';},10000);
  fetch(URL+'/auth/v1/health',{cache:'no-store'})
    .then(function(res){clearTimeout(t1);addRow('sb','步骤1 健康检查','ok','连通 HTTP '+res.status)})
    .catch(function(e){clearTimeout(t1);addRow('sb','步骤1 健康检查','bad','失败 '+e.message)});

  // 2) 真实注册请求
  var email='diag'+Date.now()+'@example.com';
  addRow('sb','步骤2 真实注册请求','wait','发送中('+email+')…');
  var t2=setTimeout(function(){var rows=$('sb').querySelectorAll('.row');var last=rows[rows.length-1];if(last)last.innerHTML='<span>步骤2 真实注册请求</span><span class="status bad">超时(10秒) → 浏览器/网络无法访问Supabase</span>';},10000);
  fetch(URL+'/auth/v1/signup',{
    method:'POST',
    cache:'no-store',
    headers:{'apikey':KEY,'Content-Type':'application/json','Authorization':'Bearer '+KEY},
    body:JSON.stringify({email:email,password:'Diag12345!'})
  })
    .then(function(res){
      clearTimeout(t2);
      return res.json().then(function(j){return {status:res.status,json:j}});
    })
    .then(function(d){
      if(d.json&&d.json.id){
        addRow('sb','步骤2 真实注册请求','ok','成功！邮箱可注册 → 网络通');
      }else if(d.json&&d.json.code){
        addRow('sb','步骤2 真实注册请求','bad','被拒: '+d.json.msg+' ('+d.status+')');
      }else{
        addRow('sb','步骤2 真实注册请求','ok','响应 '+d.status);
      }
    })
    .catch(function(e){
      clearTimeout(t2);
      addRow('sb','步骤2 真实注册请求','bad','请求异常: '+e.message);
    });
}
runTest();
</script>
</body>
</html>
