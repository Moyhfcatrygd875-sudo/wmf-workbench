<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --primary:#0d6efd; --primary-d:#0b5ed7;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
  --gold:#ca8a04; --gold-bg:#fef3c7; --gray:#6b7280; --gray-bg:#f3f4f6;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
body{padding-bottom:80px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:8px 12px;box-shadow:var(--shadow)}
.topbar h1{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.topbar .sub{font-size:11px;opacity:.85;margin-top:1px}
.search-wrap{margin-top:8px;display:flex;gap:6px}
.search-wrap input{flex:1;padding:9px 12px;border-radius:8px;border:none;font-size:14px;background:#fff}
.search-wrap .btn-search{padding:0 14px;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-weight:600}

/* tab */
.tabs{position:sticky;top:78px;z-index:40;display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 0;padding:11px 4px;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;min-width:64px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* 主体 */
.view{padding:12px;display:none}
.view.active{display:block}
.section{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.prod-card .thumb{width:100%;aspect-ratio:1;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-card .thumb img{width:100%;height:100%;object-fit:cover}
.prod-card .thumb .ph{color:var(--muted);font-size:11px}
.prod-card .info{padding:8px}
.prod-card .sn{font-weight:600;font-size:13px;word-break:break-all}
.prod-card .price{color:var(--primary);font-weight:600;margin-top:2px}
.prod-card .stock{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.55);color:#fff}
.prod-card .stock.low{background:var(--red)}
.prod-card .colors{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.prod-card .color-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}

/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.tbl th,table.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl th{background:var(--gray-bg);color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
table.tbl tr{cursor:pointer}
table.tbl tr:hover{background:#f9fafb}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.in{background:var(--green-bg);color:var(--green)}
.badge.out{background:var(--red-bg);color:var(--red)}
.badge.income{background:var(--gold-bg);color:var(--gold)}
.badge.expense{background:var(--gray-bg);color:var(--gray)}
.badge.cur{background:#dbeafe;color:var(--primary)}
.badge.company{background:#fef3c7;color:#92400e}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--gray-bg);color:var(--text);min-height:40px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;min-height:auto}
.btn-block{width:100%}
.btn-sm{padding:5px 9px;font-size:12px;min-height:auto}
.fab{position:fixed;right:16px;bottom:90px;width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;box-shadow:var(--shadow-lg);z-index:30;display:flex;align-items:center;justify-content:center;line-height:1}

/* 底部 dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:35;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--muted);min-height:50px}
.dock button.active{color:var(--primary)}
.dock button svg{width:22px;height:22px}

/* 底部弹层 sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheet-head h3{margin:0;font-size:16px;font-weight:600}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.color-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.color-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:14px;background:var(--gray-bg);font-size:12px}
.color-chip .rm{cursor:pointer;color:var(--red);font-weight:700;margin-left:2px}
.color-add{display:flex;gap:6px;margin-top:6px}
.color-add input[type=text]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px}
.color-add input[type=color]{width:36px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#fff}

/* 订单明细行 */
.item-row{background:var(--gray-bg);border-radius:10px;padding:10px;margin-bottom:8px}
.item-row .row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-row .row-top span{font-size:12px;color:var(--muted)}
.item-row .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item-row .grid3 .field{margin-bottom:6px}
.item-row .grid3 .field input,.item-row .grid3 .field select{padding:7px 8px;font-size:12px}
.item-sub{display:flex;justify-content:space-between;padding:4px 2px;font-size:12px;color:var(--muted)}
.item-sub b{color:var(--primary)}

/* toast */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:13px;max-width:80%;text-align:center;display:none}
.toast.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 搜索结果 */
.search-cat{font-size:12px;color:var(--muted);font-weight:600;padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-top:8px}
.search-item{padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.search-item:active{background:var(--gray-bg)}
.search-item .t{font-weight:600;font-size:13px}
.search-item .d{font-size:12px;color:var(--muted);margin-top:2px}
.highlight{background:#fff3cd;border-radius:2px;padding:0 2px}

/* 统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11px;color:var(--muted)}
.stat .val{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .val.income{color:var(--gold)}
.stat .val.expense{color:var(--red)}
.stat .val.net{color:var(--primary)}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
.detail-block{margin-bottom:14px}
.detail-block h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.switch{position:relative;width:42px;height:24px;background:#ccc;border-radius:14px;transition:.2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}
img.big{max-width:100%;border-radius:8px;display:block;margin:0 auto}

/* 导入导出 */
.imp-opt{display:flex;gap:8px;margin:8px 0}
.imp-opt label{display:flex;align-items:center;gap:4px;font-size:13px;background:var(--gray-bg);padding:6px 10px;border-radius:8px}
.file-label{display:block;padding:20px;border:2px dashed var(--border);border-radius:10px;text-align:center;color:var(--muted);cursor:pointer;margin:8px 0}
.file-label:active{background:var(--gray-bg)}
.preview-tbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.preview-tbl th,.preview-tbl td{padding:5px;border:1px solid var(--border);text-align:left}

/* 登录层 */
.login-mask{position:fixed;inset:0;background:linear-gradient(160deg,#0d6efd,#5b21b6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.login-mask.show{display:flex}
.login-card{background:#fff;border-radius:16px;padding:26px 22px;width:100%;max-width:360px;box-shadow:var(--shadow-lg)}
.login-card h2{margin:0 0 4px;font-size:20px;text-align:center}
.login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
.login-card .err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:none}
.login-card .info{background:#dbeafe;color:#1e40af;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:none}
.login-card .field{margin-bottom:12px}
.login-card .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.login-card .field input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.login-card .btn-block{margin-top:6px}
.login-card .switch-line{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.login-card .switch-line a{color:var(--primary);cursor:pointer;font-weight:600}
.sync-status{position:fixed;left:10px;bottom:74px;z-index:60;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:4px 9px;border-radius:12px;display:none}
.sync-status.on{display:block}
.sync-status.sync{background:#1d4ed8}
.sync-status.err{background:var(--red)}
</style>
</head>
<body>

<div class="topbar">
  <h1>🧵 外贸服装工作台</h1>
  <div class="sub" id="dataMeta">数据：本地浏览器</div>
  <div class="search-wrap">
    <input id="globalSearch" type="search" placeholder="🔍 搜唛头 / 订单号 / 款号 / 地址 / 备注…" autocomplete="off">
    <button class="btn-search" onclick="doGlobalSearch(document.getElementById('globalSearch').value)">搜索</button>
  </div>
</div>

<div class="tabs" id="tabBar">
  <div class="tab active" data-tab="products">📦 商品</div>
  <div class="tab" data-tab="customers">👥 客户</div>
  <div class="tab" data-tab="inventory">🔁 出入库</div>
  <div class="tab" data-tab="orders">📋 订单</div>
  <div class="tab" data-tab="ledger">💰 台账</div>
  <div class="tab" data-tab="search">🔎 结果</div>
  <div class="tab" data-tab="settings">⚙️ 设置</div>
</div>

<div id="view-products" class="view active">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">商品档案</h3>
      <button class="btn btn-primary btn-sm" onclick="openProductSheet()">＋ 新增商品</button>
    </div>
    <div id="productList" class="grid"></div>
  </div>
</div>

<div id="view-inventory" class="view">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">出入库记录</h3>
      <button class="btn btn-primary btn-sm" onclick="openInventorySheet()">＋ 新增记录</button>
    </div>
    <div id="inventoryList" class="tbl-wrap"></div>
  </div>
</div>

<div id="view-customers" class="view">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">客户档案</h3>
      <button class="btn btn-primary btn-sm" onclick="openCustomerSheet()">＋ 新增客户</button>
    </div>
    <div id="customerList"></div>
  </div>
</div>

<div id="view-orders" class="view">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">订单管理</h3>
      <button class="btn btn-primary btn-sm" onclick="openOrderSheet()">＋ 新增订单</button>
    </div>
    <div id="orderList" class="tbl-wrap"></div>
  </div>
</div>

<div id="view-ledger" class="view">
  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0;font-size:15px">收支台账</h3>
      <button class="btn btn-primary btn-sm" onclick="openLedgerSheet()">＋ 新增台账</button>
    </div>
    <div id="ledgerStats"></div>
    <div id="ledgerList" class="tbl-wrap"></div>
  </div>
</div>

<div id="view-search" class="view">
  <div class="section">
    <h3 style="margin:0 0 8px;font-size:15px">搜索结果</h3>
    <div id="searchResults"></div>
  </div>
</div>

<div id="view-settings" class="view">
  <div class="section" id="cloudSection">
    <h3 style="margin:0 0 12px;font-size:15px">☁️ 云同步</h3>
    <div id="cloudInfo" style="font-size:13px;margin-bottom:8px">加载中…</div>
    <button class="btn btn-block" id="logoutBtn" onclick="doLogout()" style="margin-bottom:8px;display:none">退出登录</button>
    <button class="btn btn-block" id="pwdBtn" onclick="openPwdSheet()" style="margin-bottom:8px;background:#eef2ff;color:#4338ca;display:none">🔑 修改密码</button>
    <button class="btn btn-block" id="initCloudBtn" onclick="toggleInitGuide()" style="display:none">🛠️ 显示云端初始化指引</button>
    <div id="initGuide" style="display:none;margin-top:8px;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all"></div>
  </div>
  <div class="section">
    <h3 style="margin:0 0 12px;font-size:15px">数据导入 / 导出</h3>
    <button class="btn btn-primary btn-block" onclick="exportExcel()" style="margin-bottom:8px">⬇️ 一键导出全部数据 Excel</button>
    <div class="imp-opt">
      <label><input type="radio" name="impMode" value="merge" checked> 合并（按 ID 去重）</label>
      <label><input type="radio" name="impMode" value="overwrite"> 覆盖（清空后导入）</label>
    </div>
    <label class="file-label" for="importFile">📁 点击选择 .xlsx 备份文件导入</label>
    <input id="importFile" type="file" accept=".xlsx,.xls" style="display:none" onchange="importExcel(this)">
    <div id="importPreview" style="margin-top:10px"></div>
  </div>
  <div class="section">
    <h3 style="margin:0 0 12px;font-size:15px">尺码组与币种</h3>
    <div id="configEditor"></div>
  </div>
  <div class="section">
    <h3 style="margin:0 0 12px;font-size:15px">数据维护</h3>
    <button class="btn btn-block" onclick="clearAllData()" style="margin-bottom:8px;color:var(--red)">🗑️ 清空全部数据（不可恢复）</button>
    <div style="font-size:12px;color:var(--muted)">数据保存在本机浏览器，清浏览器缓存会丢失。请定期用上方"导出 Excel"做备份。</div>
  </div>
</div>

<!-- 浮动新增按钮 -->
<button class="fab" id="fab" onclick="fabAction()">＋</button>

<!-- 底部导航 -->
<div class="dock" id="dock">
  <button data-tab="products" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>商品</button>
  <button data-tab="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>客户</button>
  <button data-tab="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>出入库</button>

<script>
/* ========== 外贸服装工作台 主脚本 ========== */
const DB_KEY='wmf_export_workbench_v1';
var DB={
  products:[], inventoryLog:[], orders:[], ledger:[], customers:[],
  config:{
    sizeGroups:{adult:['S','M','L','XL','2XL','3XL'],child:[100,110,120,130,140,150,160,170],trouser:[28,29,30,31,32,33,34,35,36,38,40,42,44]},
    currencies:[{code:'CNY',symbol:'¥',name:'人民币'},{code:'USD',symbol:'$',name:'美元'},{code:'EUR',symbol:'€',name:'欧元'}],
    warehouses:['主仓库','车间暂存']
  }
};
var currentTab='products';

/* ---------- 持久化（云同步 + 本地兜底） ---------- */
const CACHE_KEY='wmf_cloud_cache_v1';
const TBL='wmf_data';   // Supabase 表名
var sbClient=null, cloudUser=null, cloudReady=false, cloudError=false, _syncTimer=null, _lastSync={};

function hasCloudConfig(){return !!window.SUPABASE_URL && !!window.SUPABASE_KEY}
function initSupabase(){
  if(!hasCloudConfig())return false;
  try{sbClient=window.supabase&&window.supabase.createClient?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY):null;return !!sbClient}
  catch(e){console.error('supabase init fail',e);return false}
}
function saveLocal(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(DB))}catch(e){console.warn('cache write fail',e)}}
function loadLocal(){try{const s=localStorage.getItem(CACHE_KEY);if(s){const d=JSON.parse(s);mergeDB(d)}}catch(e){console.warn('cache load fail',e)}}
function mergeDB(d){
  if(!d)return;
  DB.products=d.products||DB.products||[];
  DB.inventoryLog=d.inventoryLog||DB.inventoryLog||[];
  DB.orders=d.orders||DB.orders||[];
  DB.ledger=d.ledger||DB.ledger||[];
  DB.customers=d.customers||DB.customers||[];
  if(d.config)DB.config=Object.assign(DB.config,d.config);
}
/* 保存：总是先写本地缓存(立即生效)，再异步同步云端 */
function save(){
  saveLocal();
  updateMeta();
  if(cloudReady&&sbClient&&cloudUser){scheduleSync()}
  else if(hasCloudConfig()&&!cloudUser){cloudError=true;setSyncStatus('未登录')}
}
function scheduleSync(){
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncCloud,800);
}
async function syncCloud(){
  if(!sbClient||!cloudUser||!cloudReady)return;
  setSyncStatus('syncing','同步中…');
  try{
    const uid=cloudUser.id;
    const payload={user_id:uid,data:DB,updated_at:new Date().toISOString()};
    // upsert
    const {error}=await sbClient.from(TBL).upsert({user_id:uid,data:DB,updated_at:payload.updated_at},{onConflict:'user_id'});
    if(error)throw error;
    setSyncStatus('on','已同步到云端');
  }catch(e){cloudError=true;setSyncStatus('err','同步失败，已存本机');console.error('sync fail',e)}
}
async function loadCloud(){
  if(!sbClient||!cloudUser)return;
  setSyncStatus('syncing','读取云端…');
  try{
    const {data,error}=await sbClient.from(TBL).select('data,updated_at').eq('user_id',cloudUser.id).single();
    if(error&&error.code!=='PGRST116')throw error; // PGRST116=无记录
    if(data&&data.data){mergeDB(data.data);saveLocal();renderAll()}
    cloudReady=true;
    setSyncStatus('on','已连接云端');
    setupRealtime();
  }catch(e){cloudError=true;setSyncStatus('err','云端读取失败，用本地数据');console.error('load fail',e)}
}
function setupRealtime(){
  if(!sbClient||!cloudUser)return;
  try{
    const ch=sbClient.channel('wmf_sync');
    ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:TBL,filter:'user_id=eq.'+cloudUser.id},p=>{
      const nd=p.new&&p.new.data;
      if(nd&&(!_lastSync.user_id||_lastSync.user_id!==cloudUser.id)){mergeDB(nd);saveLocal();renderAll();setSyncStatus('on','已收到更新')}
      _lastSync={user_id:cloudUser.id};
    }).subscribe();
  }catch(e){console.warn('realtime fail',e)}
}
function setSyncStatus(cls,msg){const el=document.getElementById('syncStatus');if(!el)return;el.className='sync-status '+cls;el.textContent=msg}
function dbSchemaSQL(){
  // 供用户在 Supabase SQL Editor 执行的建表语句
  return `-- 1) 数据表（存储所有业务数据的 JSON）
create table if not exists public.wmf_data(
  user_id text primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);
alter table public.wmf_data enable row level security;
create policy "own data" on public.wmf_data
  for all using (auth.uid()::text = user_id) with check (auth.uid()::text = user_id);

-- 2) 图片存储桶（product-images）的访问策略
insert into storage.buckets (id,name,public) values ('product-images','product-images',true)
  on conflict (id) do nothing;
create policy "public read images" on storage.objects
  for select using (bucket_id = 'product-images');
create policy "users upload own images" on storage.objects
  for insert with check (bucket_id = 'product-images' and auth.uid()::text = (storage.foldername(name))[1]);`;
}

/* ===== 登录 / 注册 ===== */
function switchLoginMode(){
  const isLogin=document.getElementById('loginForm').style.display!=='none';
  document.getElementById('loginForm').style.display=isLogin?'none':'block';
  document.getElementById('regForm').style.display=isLogin?'block':'none';
  document.getElementById('loginErr').style.display='none';
}
function showLoginErr(msg){const el=document.getElementById('loginErr');el.textContent=msg;el.style.display='block'}
function showLoginInfo(msg){const el=document.getElementById('loginInfo');el.textContent=msg;el.style.display='block'}
function withTimeout(p,ms,msg){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))])}
function sbFetch(path,body){
  return withTimeout(fetch(window.SUPABASE_URL+path,{
    method:'POST',cache:'no-store',
    headers:{'apikey':window.SUPABASE_KEY,'Authorization':'Bearer '+window.SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }),15000,'连接云服务器超时，请检查网络（WiFi/流量切换试试），或稍后重试');
}
function sbErrMsg(d,fallback){return (d&&(d.error_description||d.msg||d.message||d.error||d.code))||fallback}
async function doLogin(){
  if(!sbClient)return showLoginErr('云配置未就绪');
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass)return showLoginErr('请填写邮箱和密码');
  showLoginInfo('登录中…');document.getElementById('loginInfo').style.display='block';
  try{
    const r=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:pass});
    const d=await r.json();
    if(!r.ok||!d.access_token){showLoginErr(sbErrMsg(d,'登录失败('+r.status+')'));return}
    await withTimeout(sbClient.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token}), 8000, '设置登录态超时');
    onAuthSuccess(d.user);
  }catch(err){showLoginErr(err&&err.message||'连接失败，请检查网络')}
}
async function doRegister(){
  if(!sbClient)return showLoginErr('云配置未就绪');
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  if(!name)return showLoginErr('请填写你的名字');
  if(pass.length<6)return showLoginErr('密码至少 6 位');
  showLoginInfo('注册中…');document.getElementById('loginInfo').style.display='block';
  try{
    const r=await sbFetch('/auth/v1/signup',{email:email,password:pass,data:{display_name:name}});
    const d=await r.json();
    if(!r.ok){showLoginErr(sbErrMsg(d,'注册失败('+r.status+')'));return}
    showLoginInfo('注册成功！正在登录…');
    if(d.session&&d.session.access_token){
      await withTimeout(sbClient.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token}), 8000, '设置登录态超时');
      onAuthSuccess(d.user);
    }else{
      // 无 session（邮箱确认场景）：改用密码登录一次
      const r2=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:pass});
      const d2=await r2.json();
      if(!r2.ok||!d2.access_token){showLoginErr(sbErrMsg(d2,'注册后登录失败'));return}
      await withTimeout(sbClient.auth.setSession({access_token:d2.access_token,refresh_token:d2.refresh_token}), 8000, '设置登录态超时');
      onAuthSuccess(d2.user);
    }
  }catch(err){showLoginErr(err&&err.message||'连接失败，请检查网络')}
}
function onAuthSuccess(user){
  cloudUser=user;
  document.getElementById('loginMask').classList.remove('show');
  document.body.style.overflow='';
  toast('登录成功：'+(user.user_metadata&&user.user_metadata.display_name||user.email));
  loadCloud();
}
function doLogout(){
  if(!sbClient)return;
  sbClient.auth.signOut().then(()=>{cloudUser=null;cloudReady=false;showLogin()});
}
function showLogin(){
  document.getElementById('loginMask').classList.add('show');
  document.body.style.overflow='hidden';
}

/* ===== 修改登录密码 ===== */
function openPwdSheet(){
  if(!cloudUser)return toast('请先登录');
  openSheet('🔑 修改登录密码',`
    <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:10px;font-size:12px;color:#4338ca;margin-bottom:10px">
      当前账号：<b>${escapeHtml(cloudUser.email)}</b><br>
      <span style="color:#6b7280">改完后，所有登录这台账号的设备都要用新密码重新登录。</span>
    </div>
    <div class="field"><label>当前密码</label><input id="pw_old" type="password" placeholder="输入当前登录密码" autocomplete="current-password"></div>
    <div class="field"><label>新密码</label><input id="pw_new" type="password" placeholder="至少 6 位" autocomplete="new-password"></div>
    <div class="field"><label>确认新密码</label><input id="pw_new2" type="password" placeholder="再次输入新密码" autocomplete="new-password"></div>
    <div class="info" id="pwdInfo" style="display:none;background:#dbeafe;color:#1e40af;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px"></div>
  `,'保存新密码',()=>changePassword());
}
async function changePassword(){
  const old=$('pw_old').value;
  const n1=$('pw_new').value;
  const n2=$('pw_new2').value;
  if(!old)return toast('请填当前密码');
  if(n1.length<6)return toast('新密码至少 6 位');
  if(n1!==n2)return toast('两次输入的新密码不一致');
  // 1) 先验证当前密码：用当前密码重新登录拿 token（顺便证明旧密码正确）
  showPwdInfo('正在验证当前密码…');
  try{
    const email=cloudUser.email;
    const r=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:old});
    const d=await r.json();
    if(!r.ok||!d.access_token){return toast('当前密码不正确');}
    const access=d.access_token;
    // 2) 用该 token 调用更新密码
    showPwdInfo('正在更新密码…');
    const r2=await withTimeout(fetch(window.SUPABASE_URL+'/auth/v1/user',{
      method:'PUT',cache:'no-store',
      headers:{'apikey':window.SUPABASE_KEY,'Authorization':'Bearer '+access,'Content-Type':'application/json'},
      body:JSON.stringify({password:n1})
    }),15000,'连接云服务器超时');
    const d2=await r2.json();
    if(!r2.ok){return toast('修改失败：'+(d2.msg||d2.message||d2.error_description||d2.error||'('+r2.status+')'));}
    showPwdInfo('');closeSheet();
    toast('✅ 密码已修改！请用新密码重新登录');
    doLogout();
  }catch(err){showPwdInfo('');toast(err&&err.message||'修改失败，请检查网络')}
}
function showPwdInfo(msg){
  const el=$('pwdInfo');if(el){el.textContent=msg;el.style.display=msg?'block':'none'}
}

/* ===== 登录后主流程初始化 ===== */
function cloudBootstrap(){
  // 1. 尝试初始化 supabase
  const ok=initSupabase();
  if(!ok){
    // 无云配置：降级为本地版
    loadLocal();
    renderAll();
    return;
  }
  // 2. 读本地缓存立即显示
  loadLocal();
  renderAll();
  // 3. 检查登录态（加超时，防止 iOS Safari 中 SDK 挂起导致不弹登录框）
  withTimeout(sbClient.auth.getSession(), 8000, '登录态检查超时')
    .then(r=>{
      if(r.error){showLogin();return}
      if(r.data&&r.data.session){onAuthSuccess(r.data.session.user)}
      else{showLogin()}
    })
    .catch(err=>{
      console.warn('getSession fail/timeout', err);
      showLogin();
    });
}

/* ===== 默认数据 / 顶部计数 ===== */
function DB_constructor(){
  const cfg={sizeGroups:{adult:['S','M','L','XL','2XL','3XL'],child:[100,110,120,130,140,150,160,170],trouser:[28,29,30,31,32,33,34,35,36,38,40,42,44]},currencies:[{code:'CNY',symbol:'¥',name:'人民币'},{code:'USD',symbol:'$',name:'美元'},{code:'EUR',symbol:'€',name:'欧元'}],warehouses:['主仓库','车间暂存']};
  return{products:[],inventoryLog:[],orders:[],ledger:[],customers:[],config:cfg};
}
function updateMeta(){document.getElementById('dataMeta').textContent=`商品 ${DB.products.length} · 订单 ${DB.orders.length} · 出入库 ${DB.inventoryLog.length} · 台账 ${DB.ledger.length} · 客户 ${DB.customers.length}`}

/* ---------- 工具 ---------- */
function uid(prefix){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function toast(msg,ms=2000){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms)}
function fmtDate(d){if(!d)return'';d=String(d);if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);try{const dt=new Date(d);if(!isNaN(dt))return dt.toISOString().slice(0,10)}catch(e){}return d}
function todayStr(){return new Date().toISOString().slice(0,10)}
function num(v){v=parseFloat(v);return isNaN(v)?0:v}
function money(v,cur){const c=(DB.config.currencies.find(x=>x.code===cur)||DB.config.currencies[0]);return (c?c.symbol:'¥')+num(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function curSymbol(cur){const c=DB.config.currencies.find(x=>x.code===cur);return c?c.symbol:'¥'}
function productById(id){return DB.products.find(p=>p.id===id)}
function orderById(id){return DB.orders.find(o=>o.id===id)}
function customerById(id){return DB.customers.find(c=>c.id===id)}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('#tabBar .tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
document.querySelectorAll('#dock button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function switchTab(name){
  currentTab=name;
  document.querySelectorAll('#tabBar .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));

  const fab=$('fab');fab.style.display=(name==='settings'||name==='search')?'none':'flex';
  if(name==='products')fab.textContent='＋';
  if(name==='customers')fab.textContent='＋';
  if(name==='inventory')fab.textContent='＋';
  if(name==='orders')fab.textContent='＋';
  if(name==='ledger')fab.textContent='＋';
  window.scrollTo(0,0);
}
function fabAction(){
  if(currentTab==='products')openProductSheet();
  else if(currentTab==='customers')openCustomerSheet();
  else if(currentTab==='inventory')openInventorySheet();
  else if(currentTab==='orders')openOrderSheet();
  else if(currentTab==='ledger')openLedgerSheet();
}

/* ---------- 渲染入口 ---------- */
function renderAll(){
  if(currentTab==='products')renderProducts();
  if(currentTab==='customers')renderCustomers();
  if(currentTab==='inventory')renderInventory();
  if(currentTab==='orders')renderOrders();
  if(currentTab==='ledger')renderLedger();
  if(currentTab==='settings')renderSettings();
  if(currentTab==='search')doGlobalSearch($('globalSearch').value);
  updateMeta();
}

/* ============ 商品档案 ============ */
function renderProducts(){
  const el=$('productList');
  if(!DB.products.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><div>暂无商品，点击右下角"＋"新增</div></div>';return}
  el.innerHTML=DB.products.map(p=>{
    const stock=parseInt(p.库存数)||0;
    const stockCls=stock<=0?'low':'';
    const colors=(p.颜色||[]).map(c=>`<span class="color-dot" style="background:${c.c||'#ccc'}" title="${escapeHtml(c.n||'')}"></span>`).join('');
    const img=p.款式图片?`<img src="${p.款式图片}" alt="">`:`<div class="ph">无图</div>`;
    return `<div class="prod-card" onclick="openProductSheet('${p.id}')">
      <div class="thumb">${img}</div>
      <div class="stock ${stockCls}">库存 ${stock}</div>
      <div class="info">
        <div class="sn">${escapeHtml(p.款号)}</div>
        <div class="price">¥${num(p.工厂价).toFixed(2)}</div>
        <div class="colors">${colors||'<span style="font-size:11px;color:var(--muted)">无色</span>'}</div>
      </div>
    </div>`;
  }).join('');
}

var _origOpenProductSheet = function(id){

function syncSizeGroup(){const g=$('p_sizeGroup').value;const arr=DB.config.sizeGroups[g]||[];$('p_尺码组').value=arr.join(',')}
function addColorRow(){const n=$('colorName').value.trim();if(!n)return toast('请填颜色名');const c=$('colorVal').value;window._curColors.push({n,c});renderColorChips();$('colorName').value=''}
function rmColor(i){window._curColors.splice(i,1);renderColorChips()}
function renderColorChips(){const arr=window._curColors||[];$('colorChips').innerHTML=arr.length?arr.map((c,i)=>`<span class="color-chip"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.c||'#ccc'};border:1px solid rgba(0,0,0,.1)"></span>${escapeHtml(c.n)}<span class="rm" onclick="rmColor(${i})">×</span></span>`).join(''):'<span style="font-size:12px;color:var(--muted)">无</span>'}
function previewImg(input,id){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{let dataUrl=e.target.result;compressImg(dataUrl,800,0.8,cp=>{window._pendingImg=cp;$('imgPreview').innerHTML=`<img src="${cp}" style="max-width:120px;border-radius:6px">`;toast('图片已压缩，保存时上传')})};r.readAsDataURL(f)}
function compressImg(dataUrl,maxSize,quality,cb){const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const w=img.width*scale,h=img.height*scale;const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',quality))};img.src=dataUrl}
/* 上传压缩图到 Supabase Storage，返回公开 URL */
async function uploadImageToCloud(dataUrl){
  if(!sbClient||!cloudUser||!dataUrl)return dataUrl;
  const base64=dataUrl.split(',')[1];
  const bin=atob(base64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const ext='jpg';
  const path=cloudUser.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
  const {error}=await sbClient.storage.from('product-images').upload(path,arr,{contentType:'image/jpeg',upsert:false});
  if(error){console.error('img upload fail',error);toast('图片上传失败：'+error.message);return dataUrl}
  const {data:publ}=sbClient.storage.from('product-images').getPublicUrl(path);
  return publ?publ.publicUrl:dataUrl;
}
function saveProduct(id){
  const 款号=$('p_款号').value.trim();if(!款号)return toast('款号必填');
  const sizeGroup=$('p_sizeGroup').value;
  const 尺码组=$('p_尺码组').value.split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!==null);
  const data={款号,颜色:window._curColors||[],工厂价:num($('p_工厂价').value),零售价:num($('p_零售价').value),sizeGroup,尺码组,库存数:num($('p_库存数').value),autoSync:$('p_autoSync').classList.contains('on'),备注:$('p_备注').value.trim()};
  const pending=window._pendingImg;
  if(pending){
    // 有新图：先上传再保存
    uploadImageToCloud(pending).then(url=>{data.款式图片=url;finishSaveProduct(id,data)});
  }else{
    const imgPrev=$('imgPreview').querySelector('img');
    if(imgPrev)data.款式图片=imgPrev.src;
    finishSaveProduct(id,data);
  }
}
function finishSaveProduct(id,data){
  if(id){const p=productById(id);Object.assign(p,data);p.updatedAt=Date.now()}else{data.id=uid('p');data.createdAt=Date.now();DB.products.push(data)}
  window._pendingImg=null;
  save();renderProducts();closeSheet();toast('已保存');
}

function customerOrders(c){return DB.orders.filter(o=>o.客户id===c.id||o.唛头===c.名称)}
function customerBalance(c){
  // 预付款余额：客户存入 - 代付/订单扣减
  let bal=num(c.预付款||0);
  (DB.ledger||[]).forEach(r=>{if(r.客户id===c.id||r.对方===c.名称){if(r.类型==='income')bal+=num(r.金额);else bal-=num(r.金额)}});
  return bal;
}

function saveInventory(id,orig){
  const 款号id=$('i_款号id').value;if(!款号id)return toast('请选款号');
  const data={日期:$('i_日期').value||todayStr(),类型:$('i_类型').value,款号id,颜色:$('i_颜色').value,尺码:$('i_尺码').value,数量:num($('i_数量').value),关联订单id:$('i_关联订单id').value,仓库:$('i_仓库').value,经手人:$('i_经手人').value,备注:$('i_备注').value.trim()};
  const p=productById(款号id);if(p)data.款号快照=p.款号;
  if(!data.数量||data.数量<=0)return toast('数量必须>0');
  // 库存联动：原记录的影响先回滚，再应用新记录
  if(id&&p&&p.autoSync){
    const origSign=orig.类型==='in'?+num(orig.数量):-num(orig.数量);
    p.库存数=num(p.库存数)-origSign;
  }
  if(id){Object.assign(orig,data);orig.updatedAt=Date.now()}else{data.id=uid('i');data.createdAt=Date.now();DB.inventoryLog.push(data)}
  if(p&&p.autoSync){const sign=data.类型==='in'?+data.数量:-data.数量;p.库存数=num(p.库存数)+sign}
  save();renderInventory();closeSheet();toast('已保存');
}
function deleteInventory(id){const r=DB.inventoryLog.find(x=>x.id===id);if(!r)return;const p=productById(r.款号id);if(p&&p.autoSync){const sign=r.类型==='in'?-num(r.数量):+num(r.数量);p.库存数=num(p.库存数)+sign}DB.inventoryLog=DB.inventoryLog.filter(x=>x.id!==id);save();renderInventory();closeSheet();toast('已删除')}

function linkCustomer(){const cid=$('o_客户id').value;const c=customerById(cid);if(c){$('o_唛头').value=c.名称;if(!$('o_送货地址').value)$('o_送货地址').value=c.地址||''}}

/* 把 flat items（旧数据/展开后）按 款号+颜色 归组 */
function groupFlatItems(items){
  const map={};
  (items||[]).forEach(it=>{
    const p=productById(it.款号id);
    const key=(it.款号id||it.款号快照||'')+'|'+(it.颜色||'')+'|'+(num(it.单价));
    if(!map[key])map[key]={款号id:it.款号id||'',款号快照:it.款号快照||(p?p.款号:'')||'',款号:p?p.款号:(it.款号快照||''),颜色:it.颜色||'',单价:num(it.单价),码数:{}};
    map[key].码数[it.尺码]=num(it.数量);
  });
  return Object.values(map);
}
/* 把 groups 展开回 flat items（每尺码一行） */
function expandGroups(groups){
  const items=[];
  groups.forEach(g=>{
    const 款号id=g.款号id||'';
    const p=productById(款号id);
    const 款号快照=p?p.款号:(g.款号||g.款号快照||'');
    Object.keys(g.码数||{}).forEach(sz=>{
      const qty=num(g.码数[sz]);if(qty<=0)return;
      items.push({款号id,款号快照,颜色:g.颜色||'',尺码:sz,数量:qty,单价:num(g.单价)});
    });
  });
  return items;
}
function addOrderGroup(){window._orderGroups.push({款号id:'',款号快照:'',款号:'',颜色:'',单价:0,码数:{}});renderOrderItems();recalcOrder()}
function rmOrderGroup(i){window._orderGroups.splice(i,1);renderOrderItems();recalcOrder()}
function renderOrderItems(){const wrap=$('orderItems');if(!window._orderGroups||!window._orderGroups.length){wrap.innerHTML='<div style="font-size:12px;color:var(--muted);padding:6px 0">暂无明细，点击"＋ 增加一个款号"添加</div>';return}

    sizeInputs=rows.map((sz,si)=>`<div style="flex:1;min-width:120px;display:flex;gap:4px;align-items:flex-end"><div style="flex:1"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">尺码</div><input id="szname_${i}_${si}" value="${escapeHtml(String(sz))}" placeholder="如XL" oninput="onSizeName(${i},${si},this.value)" style="width:100%;padding:7px 4px;border:1px solid var(--border);border-radius:6px;text-align:center"></div><div style="flex:1"><div style="font-size:11px;color:var(--muted);margin-bottom:3px">数量</div><input id="szqty_${i}_${si}" type="number" min="0" value="${码数[sz]||''}" placeholder="0" oninput="onSizeQty(${i},${si},this.value)" style="width:100%;padding:7px 4px;border:1px solid var(--border);border-radius:6px;text-align:center"></div></div>`).join('');
    sizeHelp=`<button class="btn btn-sm" style="margin-top:6px" onclick="addCustomSize(${i})">＋ 加一个尺码</button>`;
  }

  const rowSub=rowQty*num(g.单价);
  return`<div class="item-row">

      <input id="it_prod_${i}" list="prodList" value="${escapeHtml(g.款号||g.款号快照||'')}" placeholder="输入或选择款号，如 A290" oninput="onProdInput(${i},this.value)" onchange="onProdInput(${i},this.value)">
    </div>
    <div class="grid3" style="grid-template-columns:1fr 1fr 1fr">
      <div class="field"><label>颜色（可手打或选）</label><input id="it_color_${i}" list="${colorListId}" value="${escapeHtml(g.颜色||'')}" placeholder="如黑色" oninput="onColorInput(${i},this.value)">${colorOpts?`<datalist id="${colorListId}">${colorOpts}</datalist>`:''}</div>
      <div class="field"><label>单价 ${curSymbol($('o_币种').value)}</label><input id="it_price_${i}" type="number" step="0.01" value="${g.单价}" oninput="onPriceInput(${i},this.value)"></div>
      <div class="field"><label>本款小计</label><input id="it_sub_${i}" readonly value="${rowSub.toFixed(2)}" style="background:#f9fafb;font-weight:600"></div>
    </div>
    <div class="field"><label style="margin-bottom:2px">尺码数量（每码单独填，合计 ${rowQty} 件）</label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px">${sizeInputs}</div>
      ${sizeHelp}
    </div>
    ${p?'':`<div style="font-size:11px;color:var(--muted);margin-top:4px">⚠️ 该款未录入商品档案，请自行填写尺码名和数量。建议到"商品"里录入该款（含尺码表），以后更省事。</div>`}
  </div>`;
}).join('')}
function onProdInput(i,val){
  const g=window._orderGroups[i];
  val=(val||'').trim();
  // 尝试匹配商品款号（先精确，再模糊）
  const p=DB.products.find(x=>x.款号===val)||DB.products.find(x=>x.款号.toLowerCase().includes(val.toLowerCase()));
  if(p){g.款号id=p.id;g.款号=p.款号;g.款号快照=p.款号;if(!g.颜色)g.颜色=(p.颜色&&p.颜色[0])?p.颜色[0].n:'';if(!num(g.单价))g.单价=num(p.工厂价);if(!Object.keys(g.码数||{}).length)g.码数={};}
  else{g.款号id='';g.款号=val;g.款号快照=val;g.码数=g.码数||{};}
  renderOrderItems();recalcOrder();
}
function onColorInput(i,val){window._orderGroups[i].颜色=(val||'').trim();recalcOrder()}
function onPriceInput(i,val){window._orderGroups[i].单价=num(val);updateGroupSub(i);recalcOrder()}
/* 尺码数量：si 为下标。已录商品按尺码组下标取尺码名；未录商品按码数键顺序取 */
function onSizeQty(i,si,val){
  const g=window._orderGroups[i];const p=g.款号id?productById(g.款号id):null;if(!g.码数)g.码数={};
  if(p&&p.尺码组&&p.尺码组.length){g.码数[p.尺码组[si]]=num(val)}
  else{const keys=Object.keys(g.码数);const sz=keys[si]!==undefined?keys[si]:'';g.码数[sz]=num(val)}
  updateGroupSub(i);recalcOrder();
}
function onSizeName(i,si,val){
  const g=window._orderGroups[i];const keys=Object.keys(g.码数||{});const old=keys[si];
  if(old===undefined){g.码数[val.trim()]='';}
  else{const qty=g.码数[old];delete g.码数[old];g.码数[val.trim()]=qty;}
  renderOrderItems();
}
function addCustomSize(i){const g=window._orderGroups[i];if(!g.码数)g.码数={};g.码数['']='';renderOrderItems()}
function updateGroupSub(i){const g=window._orderGroups[i];const rowQty=Object.values(g.码数||{}).reduce((s,v)=>s+num(v),0);const el=$('it_sub_'+i);if(el)el.value=(rowQty*num(g.单价)).toFixed(2)}
function groupQty(g){return Object.values(g.码数||{}).reduce((s,v)=>s+num(v),0)}
function recalcOrder(){const groups=window._orderGroups||[];const sub=groups.reduce((s,g)=>s+groupQty(g)*num(g.单价),0);const cnt=groups.reduce((s,g)=>s+groupQty(g),0);const freight=num($('o_运费').value);const other=num($('o_其他费用').value);const tot=sub+freight+other;const cur=$('o_币种').value;$('orderSummary').innerHTML=`<div style="display:flex;justify-content:space-between;margin:2px 0"><span>总件数</span><b>${cnt} 件</b></div><div style="display:flex;justify-content:space-between;margin:2px 0"><span>明细小计</span><b>${money(sub,cur)}</b></div><div style="display:flex;justify-content:space-between;margin:2px 0"><span>运费 + 其他</span><b>${money(freight+other,cur)}</b></div><div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"><span style="font-weight:600">订单总价</span><b style="color:var(--primary);font-size:16px">${money(tot,cur)}</b></div>`}
function saveOrder(id){
  const 订单号=$('o_订单号').value.trim();if(!订单号)return toast('订单号必填');
  const 唛头=$('o_唛头').value.trim();if(!唛头)return toast('唛头必填');

  if(!data.items.length)return toast('至少填一个尺码数量（数量要>0）');
  if(id){const o=orderById(id);Object.assign(o,data);o.updatedAt=Date.now()}else{data.id=uid('o');data.createdAt=Date.now();DB.orders.push(data)}
  save();renderOrders();closeSheet();toast('已保存');
}
function deleteOrder(id){DB.orders=DB.orders.filter(o=>o.id!==id);DB.inventoryLog=DB.inventoryLog.filter(r=>r.关联订单id!==id);save();renderOrders();closeSheet();toast('已删除订单')}

      <div class="field"><label>类型 *</label><select id="l_类型" onchange="syncLedgerCat()"><option value="income" ${r.类型==='income'?'selected':''}>收入</option><option value="expense" ${r.类型==='expense'?'selected':''}>支出</option></select></div>
    </div>
    <div class="field"><label>分类</label><select id="l_分类"></select></div>
    <div class="field-row">
      <div class="field"><label>金额 *</label><input id="l_金额" type="number" step="0.01" value="${r.金额||0}"></div>
      <div class="field"><label>币种</label><select id="l_币种">${curOpts}</select></div>
    </div>
    <div class="field"><label>关联客户（可选，会影响该客户余额）</label><select id="l_客户id" onchange="linkLedgerCust()">${custOpts}</select></div>
    <div class="field"><label>关联订单</label><select id="l_关联订单id">${orderOpts}</select></div>
    <div class="field"><label>对方（客户/工厂）</label><input id="l_对方" value="${escapeHtml(r.对方)}"></div>
    <div class="field"><label>备注</label><textarea id="l_备注">${escapeHtml(r.备注)}</textarea></div>
  `,id?'保存':'新增',()=>saveLedger(id));
  window._curLedgerType=r.类型;syncLedgerCat();setTimeout(()=>{$('l_分类').value=r.分类},0);
}
function linkLedgerCust(){const cid=$('l_客户id').value;const c=customerById(cid);if(c){$('l_对方').value=c.名称;$('l_币种').value=c.币种||'CNY'}}
function syncLedgerCat(){const t=$('l_类型').value;const cats=t==='income'?['客户收款','退款收回','其他收入']:['工厂付款','运费','其他支出'];$('l_分类').innerHTML=cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
function saveLedger(id){
  const data={日期:$('l_日期').value||todayStr(),类型:$('l_类型').value,分类:$('l_分类').value,关联订单id:$('l_关联订单id').value,客户id:$('l_客户id').value,金额:num($('l_金额').value),币种:$('l_币种').value,对方:$('l_对方').value.trim(),备注:$('l_备注').value.trim()};
  if(data.金额<=0)return toast('金额必须>0');
  if(id){const r=DB.ledger.find(x=>x.id===id);Object.assign(r,data);r.updatedAt=Date.now()}else{data.id=uid('l');data.createdAt=Date.now();DB.ledger.push(data)}
  save();renderLedger();closeSheet();toast('已保存');
}
function deleteLedger(id){DB.ledger=DB.ledger.filter(x=>x.id!==id);save();renderLedger();closeSheet();toast('已删除')}

/* ============ 全局搜索 ============ */
function doGlobalSearch(q){
  q=(q||'').trim().toLowerCase();
  const el=$('searchResults');
  if(!q){el.innerHTML='<div class="empty">输入关键词搜索唛头 / 订单号 / 款号 / 备注 / 送货地址</div>';return}
  const results={products:[],orders:[],inventory:[],ledger:[],customers:[]};
  DB.products.forEach(p=>{if([p.款号,(p.颜色||[]).map(c=>c.n).join(' '),p.备注].join(' ').toLowerCase().includes(q))results.products.push(p)});
  DB.customers.forEach(c=>{if([c.名称,c.电话,c.地址,c.备注].join(' ').toLowerCase().includes(q))results.customers.push(c)});
  DB.orders.forEach(o=>{if([o.订单号,o.唛头,o.送货地址,o.备注,o.公司单备注].join(' ').toLowerCase().includes(q)||(o.items||[]).some(it=>{const p=productById(it.款号id);return p&&p.款号.toLowerCase().includes(q)}))results.orders.push(o)});
  DB.inventoryLog.forEach(r=>{const p=productById(r.款号id);if([r.颜色,r.尺码,r.仓库,r.经手人,r.备注,p?p.款号:''].join(' ').toLowerCase().includes(q))results.inventory.push(r)});
  DB.ledger.forEach(r=>{if([r.分类,r.对方,r.备注].join(' ').toLowerCase().includes(q))results.ledger.push(r)});
  const total=Object.values(results).reduce((s,a)=>s+a.length,0);
  let html=`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">共找到 ${total} 条结果</div>`;
  if(!total){el.innerHTML=html+'<div class="empty">无匹配</div>';return}
  if(results.customers.length)html+=`<div class="search-cat">客户档案（${results.customers.length}）</div>`+results.customers.map(c=>`<div class="search-item" onclick="openCustomerDetail('${c.id}')"><div class="t">${highlight(c.名称,q)}</div><div class="d">${escapeHtml(c.电话||'')} · ${escapeHtml(c.地址||'')}</div></div>`).join('');
  if(results.products.length)html+=`<div class="search-cat">商品档案（${results.products.length}）</div>`+results.products.map(p=>`<div class="search-item" onclick="jumpTo('products','${p.id}')"><div class="t">${highlight(p.款号,q)}</div><div class="d">工厂价 ¥${num(p.工厂价).toFixed(2)} · 库存 ${p.库存数}</div></div>`).join('');
  if(results.orders.length)html+=`<div class="search-cat">订单（${results.orders.length}）</div>`+results.orders.map(o=>`<div class="search-item" onclick="jumpTo('orders','${o.id}')"><div class="t">${highlight(o.订单号,q)} · ${highlight(o.唛头,q)}</div><div class="d">${fmtDate(o.日期)} · ${money(orderTotal(o),o.币种)} · ${escapeHtml(o.送货地址||'')}</div></div>`).join('');
  if(results.inventory.length)html+=`<div class="search-cat">出入库（${results.inventory.length}）</div>`+results.inventory.map(r=>{const p=productById(r.款号id);return`<div class="search-item" onclick="jumpTo('inventory','${r.id}')"><div class="t">${r.类型==='in'?'入库':'出库'} ${num(r.数量)}件 · ${highlight(p?p.款号:'',q)}</div><div class="d">${fmtDate(r.日期)} · ${escapeHtml(r.颜色)} ${escapeHtml(r.尺码)} · ${escapeHtml(r.仓库)}</div></div>`}).join('');
  if(results.ledger.length)html+=`<div class="search-cat">台账（${results.ledger.length}）</div>`+results.ledger.map(r=>`<div class="search-item" onclick="jumpTo('ledger','${r.id}')"><div class="t">${r.类型==='income'?'收入':'支出'} ${money(r.金额,r.币种)} · ${highlight(r.分类,q)} · ${highlight(r.对方,q)}</div><div class="d">${fmtDate(r.日期)}</div></div>`).join('');
  el.innerHTML=html;
}
function highlight(s,q){s=String(s==null?'':s);const idx=s.toLowerCase().indexOf(q);if(idx<0)return escapeHtml(s);return escapeHtml(s.slice(0,idx))+`<span class="highlight">${escapeHtml(s.slice(idx,idx+q.length))}</span>`+escapeHtml(s.slice(idx+q.length))}
function jumpTo(type,id){switchTab(type);setTimeout(()=>{const map={products:openProductSheet,inventory:openInventorySheet,orders:openOrderSheet,ledger:openLedgerSheet,customers:openCustomerDetail};if(map[type])map[type](id)},100)}

  // 订单明细

  DB.orders.forEach(o=>{(o.items||[]).forEach((it,i)=>{itemsSheet.push({订单id:o.id,订单号:o.订单号,行号:i+1,款号id:it.款号id,款号:(()=>{const p=productById(it.款号id);return p?p.款号:it.款号快照||''})(),颜色:it.颜色,尺码:it.尺码,数量:it.数量,单价:it.单价,小计:num(it.数量)*num(it.单价)})})});

  // 客户
  const custSheet=DB.customers.map(c=>({名称:c.名称,电话:c.电话,地址:c.地址,币种:c.币种,预付款:c.预付款,备注:c.备注,id:c.id,createdAt:c.createdAt}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(custSheet||[{}]),'客户档案');
  // 出入库
  const invSheet=DB.inventoryLog.map(r=>({日期:fmtDate(r.日期),类型:r.类型==='in'?'入库':'出库',款号id:r.款号id,款号:(()=>{const p=productById(r.款号id);return p?p.款号:r.款号快照||''})(),颜色:r.颜色,尺码:r.尺码,数量:r.数量,关联订单id:r.关联订单id,仓库:r.仓库,经手人:r.经手人,备注:r.备注,id:r.id,createdAt:r.createdAt}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(invSheet||[{}]),'出入库记录');
  // 台账
  const ledSheet=DB.ledger.map(r=>({日期:fmtDate(r.日期),类型:r.类型==='income'?'收入':'支出',分类:r.分类,金额:r.金额,币种:r.币种,关联订单id:r.关联订单id,客户id:r.客户id||'',对方:r.对方,备注:r.备注,id:r.id,createdAt:r.createdAt}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ledSheet||[{}]),'收支台账');

/* ============ Excel 导入 ============ */
function importExcel(input){
  const f=input.files[0];if(!f)return;
  const mode=document.querySelector('input[name=impMode]:checked').value;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const names=wb.SheetNames;
      const preview=$('importPreview');
      const parseSheet=(name)=>{const ws=wb.Sheets[name];if(!ws)return[];return XLSX.utils.sheet_to_json(ws,{defval:''})};
      // 预览
      let html='<div style="font-size:13px;margin-bottom:6px"><b>检测到数据：</b></div><table class="preview-tbl"><thead><tr><th>Sheet</th><th>条数</th></tr></thead><tbody>';
      ['商品档案','客户档案','订单','订单明细','出入库记录','收支台账','_meta'].forEach(n=>{const arr=parseSheet(n);if(names.includes(n))html+=`<tr><td>${n}</td><td>${arr.length}</td></tr>`});
      html+='</tbody></table>';
      html+=`<div style="margin-top:10px"><button class="btn btn-success btn-block" onclick="doImport('${mode}')">确认导入（${mode==='merge'?'合并':'覆盖'}）</button></div>`;
      preview.innerHTML=html;
      window._pendingWB=wb;
      toast('已读取，请确认导入');
    }catch(err){toast('导入失败：'+err.message)}
  };
  reader.readAsArrayBuffer(f);
  input.value='';
}
function doImport(mode){
  const wb=window._pendingWB;if(!wb)return toast('无待导入文件');
  const parseSheet=(name)=>{const ws=wb.Sheets[name];if(!ws)return[];return XLSX.utils.sheet_to_json(ws,{defval:''})};
  let newProducts=[],newOrders=[],newItems=[],newInv=[],newLed=[],newCust=[],newCfg=null;
  // 商品
  parseSheet('商品档案').forEach(r=>{
    const id=r.id||uid('p');
    const colors=[];
    const ns=String(r.颜色||'').split('/').filter(Boolean);
    const cs=String(r.颜色值||'').split('/').filter(Boolean);
    ns.forEach((n,i)=>colors.push({n,c:cs[i]||'#cccccc'}));
    newProducts.push({id,款号:r.款号||'',颜色:colors,工厂价:num(r['工厂价(¥)']),零售价:num(r['零售价(¥)']),sizeGroup:r.尺码组类型||'adult',尺码组:String(r.尺码组||'').split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null),库存数:num(r.库存数),autoSync:r.自动联动库存==='是',款式图片:'',备注:r.备注||'',createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt});
  });
  // 客户
  parseSheet('客户档案').forEach(r=>{if(!r.名称)return;newCust.push({id:r.id||uid('c'),名称:r.名称,电话:r.电话||'',地址:r.地址||'',币种:r.币种||'CNY',预付款:num(r.预付款),备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 订单
  parseSheet('订单').forEach(r=>{
    newOrders.push({id:r.id||uid('o'),订单号:r.订单号||'',唛头:r.唛头||'',客户id:r.客户id||'',日期:fmtDate(r.日期),币种:r.币种||'CNY',送货地址:r.送货地址||'',是否公司单:r.公司单==='是',公司单备注:r.公司单备注||'',items:[],运费:num(r.运费),其他费用:num(r.其他费用),备注:r.备注||'',createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt});
  });
  // 订单明细
  const itemsByOrder={};
  parseSheet('订单明细').forEach(r=>{const oid=r.订单id||newOrders.find(o=>o.订单号===r.订单号)?.id;if(oid){(itemsByOrder[oid]=itemsByOrder[oid]||[]).push({款号id:r.款号id||'',款号快照:r.款号||'',颜色:r.颜色||'',尺码:r.尺码!==''?r.尺码:'',数量:num(r.数量),单价:num(r.单价)})}});
  newOrders.forEach(o=>o.items=itemsByOrder[o.id]||[]);
  // 出入库
  parseSheet('出入库记录').forEach(r=>{newInv.push({id:r.id||uid('i'),日期:fmtDate(r.日期),类型:r.类型==='入库'?'in':'out',款号id:r.款号id||'',款号快照:r.款号||'',颜色:r.颜色||'',尺码:r.尺码!==''?r.尺码:'',数量:num(r.数量),关联订单id:r.关联订单id||'',仓库:r.仓库||'',经手人:r.经手人||'',备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 台账
  parseSheet('收支台账').forEach(r=>{newLed.push({id:r.id||uid('l'),日期:fmtDate(r.日期),类型:r.类型==='收入'?'income':'expense',分类:r.分类||'',金额:num(r.金额),币种:r.币种||'CNY',关联订单id:r.关联订单id||'',客户id:r.客户id||'',对方:r.对方||'',备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 配置
  const meta=parseSheet('_meta')[0];
  if(meta){const sg=DB.config.sizeGroups;if(meta.尺码组_adult)sg.adult=String(meta.尺码组_adult).split(',').filter(Boolean);if(meta.尺码组_child)sg.child=String(meta.尺码组_child).split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null);if(meta.尺码组_trouser)sg.trouser=String(meta.尺码组_trouser).split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null);if(meta.仓库)DB.config.warehouses=String(meta.仓库).split(',').filter(Boolean);if(meta.币种)DB.config.currencies=String(meta.币种).split('|').map(s=>{const[a,b,c]=s.split(',');return{code:a,symbol:b,name:c}}).filter(x=>x.code)}
  // 合并或覆盖
  if(mode==='overwrite'){DB.products=newProducts;DB.orders=newOrders;DB.inventoryLog=newInv;DB.ledger=newLed;DB.customers=newCust}
  else{
    const merge=(arr,oldArr,idKey)=>{const ids=new Set(oldArr.map(x=>x.id));arr.forEach(x=>{if(!ids.has(x.id))oldArr.push(x);else{const t=oldArr.find(o=>o.id===x.id);Object.assign(t,x)}})};
    merge(newProducts,DB.products);merge(newOrders,DB.orders);merge(newInv,DB.inventoryLog);merge(newLed,DB.ledger);merge(newCust,DB.customers);
    // 明细合并到订单
    newOrders.forEach(o=>{const t=orderById(o.id);if(t)t.items=o.items});
  }
  save();renderAll();
  $('importPreview').innerHTML='<div style="color:var(--green);font-size:13px">✅ 导入完成：'+newProducts.length+' 商品 / '+newOrders.length+' 订单 / '+newInv.length+' 出入库 / '+newLed.length+' 台账 / '+newCust.length+' 客户</div>';
  toast('导入成功');
  window._pendingWB=null;
}

function clearAllData(){if(!confirm('确定清空全部数据？此操作不可恢复！建议先导出 Excel 备份。'))return;DB=DB_constructor();save();renderAll();toast('已清空')}

/* ============ sheet 弹层 ============ */
function openSheet(title,bodyHTML,btnLabel,onSave,opts){
  opts=opts||{};
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=bodyHTML;
  let footHTML=`<button class="btn btn-block" onclick="closeSheet()">取消</button>`;
  if(onSave)footHTML=`<button class="btn btn-primary btn-block" id="sheetSave">${btnLabel||'保存'}</button><button class="btn btn-block" onclick="closeSheet()">取消</button>`;
  if(opts.deleteId)footHTML=`<button class="btn btn-danger" onclick="deleteRow('${opts.deleteType}','${opts.deleteId}')">删除</button>`+footHTML;
  $('sheetFoot').innerHTML=footHTML;
  if(onSave)$('sheetSave').onclick=()=>{try{onSave()}catch(e){toast('错误：'+e.message);console.error(e)}};
  $('sheetMask').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeSheet(){$('sheetMask').classList.remove('show');document.body.style.overflow='';window._curColors=null;window._orderItems=null;window._orderGroups=null;window._curLedgerType=null}
$('sheetMask').onclick=e=>{if(e.target===$('sheetMask'))closeSheet()};
function deleteRow(type,id){if(!confirm('确定删除？'))return;if(type==='product'){DB.products=DB.products.filter(x=>x.id!==id);renderProducts()}if(type==='customer')deleteCustomer(id);if(type==='inventory')deleteInventory(id);if(type==='order')deleteOrder(id);if(type==='ledger')deleteLedger(id);closeSheet()}
