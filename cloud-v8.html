<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --primary:#8B2C3A; --primary-d:#6E2230;
  --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
  --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
  --gold:#ca8a04; --gold-bg:#fef3c7; --gray:#6b7280; --gray-bg:#f3f4f6;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
body{padding-bottom:80px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:8px 12px;box-shadow:var(--shadow)}
.topbar h1{margin:0;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.topbar .sub{font-size:11px;opacity:.85;margin-top:1px}
.search-wrap{margin-top:8px;display:flex;gap:6px}
.search-wrap input{flex:1;padding:9px 12px;border-radius:8px;border:none;font-size:14px;background:#fff}
.search-wrap .btn-search{padding:0 14px;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-weight:600}

/* tab */
.tabs{position:sticky;top:78px;z-index:40;display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 0;padding:11px 4px;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;min-width:64px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* 主体 */
.view{padding:12px;display:none}
.view.active{display:block}
.section{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}

/* 卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.prod-card .thumb{width:100%;aspect-ratio:1;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-card .thumb img{width:100%;height:100%;object-fit:cover}
.prod-card .thumb{position:relative}
.draft-badge{position:absolute;top:4px;left:4px;background:#b45309;color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;z-index:2}
.prod-card .price.sale{color:#8B2C3A;font-weight:600}
.prod-card .thumb .ph{color:var(--muted);font-size:11px}
.prod-card .info{padding:8px}
.prod-card .sn{font-weight:600;font-size:13px;word-break:break-all}
.prod-card .price{color:var(--primary);font-weight:600;margin-top:2px}
.prod-card .stock{position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.55);color:#fff}
.prod-card .stock.low{background:var(--red)}
.prod-card .colors{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.prod-card .color-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}

/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.tbl th,table.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl th{background:var(--gray-bg);color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0}
table.tbl tr{cursor:pointer}
table.tbl tr:hover{background:#f9fafb}
table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.in{background:var(--green-bg);color:var(--green)}
.badge.out{background:var(--red-bg);color:var(--red)}
.badge.income{background:var(--gold-bg);color:var(--gold)}
.badge.expense{background:var(--gray-bg);color:var(--gray)}
.badge.cur{background:#f6e2e6;color:var(--primary)}
.badge.company{background:#fef3c7;color:#92400e}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;background:var(--gray-bg);color:var(--text);min-height:40px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-ghost{background:transparent;color:var(--primary);padding:6px 10px;min-height:auto}
.btn-block{width:100%}
.btn-sm{padding:5px 9px;font-size:12px;min-height:auto}
.fab{position:fixed;right:16px;bottom:90px;width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;font-size:28px;box-shadow:var(--shadow-lg);z-index:30;display:flex;align-items:center;justify-content:center;line-height:1}

/* 底部 dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:35;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10px;color:var(--muted);min-height:50px}
.dock button.active{color:var(--primary)}
.dock button svg{width:22px;height:22px}

/* 底部弹层 sheet */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.sheet-mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheet-head h3{margin:0;font-size:16px;font-weight:600}
.sheet-body{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.color-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.color-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:14px;background:var(--gray-bg);font-size:12px}
.color-chip .rm{cursor:pointer;color:var(--red);font-weight:700;margin-left:2px}
.color-add{display:flex;gap:6px;margin-top:6px}
.color-add input[type=text]{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px}
.color-add input[type=color]{width:36px;height:36px;padding:2px;border:1px solid var(--border);border-radius:6px;background:#fff}

/* 订单明细行 */
.item-row{background:var(--gray-bg);border-radius:10px;padding:10px;margin-bottom:8px}
.item-row .row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-row .row-top span{font-size:12px;color:var(--muted)}
.item-row .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item-row .grid3 .field{margin-bottom:6px}
.item-row .grid3 .field input,.item-row .grid3 .field select{padding:7px 8px;font-size:12px}
.item-sub{display:flex;justify-content:space-between;padding:4px 2px;font-size:12px;color:var(--muted)}
.item-sub b{color:var(--primary)}

/* toast */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:13px;max-width:80%;text-align:center;display:none}
.toast.show{display:block;animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 搜索结果 */
.search-cat{font-size:12px;color:var(--muted);font-weight:600;padding:8px 4px 4px;border-bottom:1px solid var(--border);margin-top:8px}
.search-item{padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer}
.search-item:active{background:var(--gray-bg)}
.search-item .t{font-weight:600;font-size:13px}
.search-item .d{font-size:12px;color:var(--muted);margin-top:2px}
.highlight{background:#fff3cd;border-radius:2px;padding:0 2px}

/* 统计卡 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:10px;padding:10px;box-shadow:var(--shadow)}
.stat .lbl{font-size:11px;color:var(--muted)}
.stat .val{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .val.income{color:var(--gold)}
.stat .val.expense{color:var(--red)}
.stat .val.net{color:var(--primary)}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
.empty svg{width:48px;height:48px;opacity:.4;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
.detail-block{margin-bottom:14px}
.detail-block h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.switch{position:relative;width:42px;height:24px;background:#ccc;border-radius:14px;transition:.2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}
img.big{max-width:100%;border-radius:8px;display:block;margin:0 auto}

/* 导入导出 */
.imp-opt{display:flex;gap:8px;margin:8px 0}
.imp-opt label{display:flex;align-items:center;gap:4px;font-size:13px;background:var(--gray-bg);padding:6px 10px;border-radius:8px}
.file-label{display:block;padding:20px;border:2px dashed var(--border);border-radius:10px;text-align:center;color:var(--muted);cursor:pointer;margin:8px 0}
.file-label:active{background:var(--gray-bg)}
.preview-tbl{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.preview-tbl th,.preview-tbl td{padding:5px;border:1px solid var(--border);text-align:left}

/* 登录层 */
.login-mask{position:fixed;inset:0;background:linear-gradient(160deg,#8B2C3A,#4a1620);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.login-mask.show{display:flex}
.login-card{background:#fff;border-radius:16px;padding:26px 22px;width:100%;max-width:360px;box-shadow:var(--shadow-lg)}
.login-card h2{margin:0 0 4px;font-size:20px;text-align:center}
.login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}
.login-card .err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:none}
.login-card .info{background:#f6e2e6;color:#8B2C3A;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px;display:none}
.login-card .field{margin-bottom:12px}
.login-card .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.login-card .field input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.login-card .btn-block{margin-top:6px}
.login-card .switch-line{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.login-card .switch-line a{color:var(--primary);cursor:pointer;font-weight:600}
.sync-status{position:fixed;left:10px;bottom:74px;z-index:60;background:rgba(0,0,0,.72);color:#fff;font-size:11px;padding:4px 9px;border-radius:12px;display:none}
.sync-status.on{display:block}
.sync-status.sync{background:#1d4ed8}
.sync-status.err{background:var(--red)}

/* ===== [NEW] 订单编辑：全局开关 / 头部新字段 / 财务区 ===== */
.toggle-line{display:flex;align-items:center;justify-content:space-between;background:var(--gray-bg);border-radius:8px;padding:8px 10px;margin:8px 0}
.toggle-line .tl-l{font-size:13px;font-weight:600}
.toggle-line .tl-sub{font-size:11px;color:var(--muted);margin-top:1px}
.switch-label{font-size:12px;color:var(--muted)}
.fin-block{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;margin:10px 0}
.fin-block .fb-title{font-size:13px;font-weight:700;color:#c2410c;margin-bottom:8px}
.mode-switch{display:flex;gap:6px;margin:4px 0 8px}
.mode-switch button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--muted)}
.mode-switch button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.dim-input{opacity:.45;pointer-events:none}
/* 尺码范围：白色可编辑输入框，仅展示打印，不参与运算 */
.range-input{width:100%;padding:6px 8px;border:1px dashed #cbd5e1;border-radius:6px;background:#fff;font-size:13px;color:var(--text)}
.range-input:focus{outline:none;border-color:var(--primary)}
.no-size-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px;margin:8px 0}
.sub-col{font-weight:600;color:var(--primary)}

/* ===== [NEW] 装箱单模块 ===== */
.pack-list-item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.pack-list-item .pl-title{font-weight:600}
.pack-list-item .pl-sub{font-size:12px;color:var(--muted);margin-top:2px}
.pl-table{width:100%;border-collapse:collapse;font-size:12px}
.pl-table th,.pl-table td{border:1px solid var(--border);padding:5px 4px;text-align:center;vertical-align:middle}
.pl-table th{background:#f8fafc;font-size:11px;color:var(--muted);font-weight:600}
.pl-table input{width:100%;border:none;background:transparent;text-align:center;font-size:12px;padding:3px}
.pl-table input:focus{outline:1px solid var(--primary);background:#fff}
.pl-add-row{margin:8px 0}

/* ===== [NEW] 打印 / 对外合同（@media print 内联） ===== */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;left:0;top:0;width:100%;padding:0;background:#fff}
  .no-print{display:none!important}
  @page{margin:12mm}
}
.contract{max-width:760px;margin:0 auto;padding:16px;color:#111;font-size:13px;line-height:1.6}
.contract h2{text-align:center;font-size:20px;margin:0 0 4px;letter-spacing:1px}
.contract .c-sub{text-align:center;color:#666;font-size:12px;margin-bottom:12px}
.contract .c-head{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:12px}
.contract .c-head div{font-size:13px}
.contract table.c-tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.contract table.c-tbl th,.contract table.c-tbl td{border:1px solid #333;padding:5px 6px;text-align:center}
.contract table.c-tbl th{background:#f3f4f6}
.contract .c-foot{margin-top:12px;font-size:13px}
.contract .c-remark{margin-top:8px;font-size:12px;color:#333;white-space:pre-wrap}
.packlist{max-width:900px;margin:0 auto;padding:16px;color:#111;font-size:12px}
.packlist h1{text-align:center;font-size:22px;letter-spacing:2px;margin:0 0 10px}
.packlist .pl-head{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:10px}
.packlist table.pl-tbl{width:100%;border-collapse:collapse;margin-top:8px}
.packlist table.pl-tbl th,.packlist table.pl-tbl td{border:1px solid #333;padding:4px 5px;text-align:center}
.packlist .pl-total{text-align:right;font-weight:700;margin-top:8px;font-size:13px}

/* 订单商品明细表格（范围驱动录入） */
.sz-wrap{overflow-x:auto;margin:8px 0;border:1px solid var(--border);border-radius:8px}
.sz-tbl{border-collapse:collapse;width:100%;min-width:540px;font-size:12px;background:#fff}
.sz-tbl th,.sz-tbl td{border:1px solid var(--border);padding:5px 6px;text-align:center;vertical-align:top}
.sz-tbl th{background:#f1f5f9;font-weight:600;color:#475569;white-space:nowrap}
.sz-tbl .c-name{text-align:left;min-width:160px}
.sz-tbl .c-name .ci,.sz-tbl .c-name .ri{width:100%;padding:6px 4px;border:1px solid var(--border);border-radius:6px;font-size:12px;margin-bottom:4px;box-sizing:border-box}
.sz-tbl .sz-in{width:54px;padding:6px 2px;border:1px solid var(--border);border-radius:6px;text-align:center;font-size:12px}
.sz-tbl .sz-off{color:#cbd5e1;background:#f8fafc}
.sz-tbl .c-cnt{font-weight:600;background:#eef2ff}
.sz-tbl .c-sub{color:#8B2C3A;font-weight:600}
.sz-tbl .cnt-row{display:flex;gap:4px;align-items:center;margin:2px 0}
.sz-tbl .cnt-row input{width:62px;padding:5px 4px;border:1px solid var(--border);border-radius:6px;font-size:12px}
.sz-tbl .cnt-row button{padding:4px 7px;font-size:11px;background:#8B2C3A;color:#fff;border:none;border-radius:6px;white-space:nowrap}
.item-row .prod-row{display:flex;gap:8px;align-items:stretch}
.item-row .prod-row input{flex:1;min-width:0}
.style-thumb{width:42px;height:42px;border-radius:8px;overflow:hidden;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;border:1px solid rgba(0,0,0,.06);box-sizing:border-box}
.style-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.style-thumb .ph{font-size:11px;color:var(--muted)}
.sz-tbl .msz-box{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sz-tbl .msz{display:inline-flex;gap:2px;align-items:center;background:#f1f5f9;border:1px solid var(--border);border-radius:6px;padding:2px 3px}
.sz-tbl .msz .msz-n{width:46px;padding:3px 2px;border:1px solid var(--border);border-radius:4px;font-size:11px}
.sz-tbl .msz .msz-q{width:42px;padding:3px 2px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:11px}
.sz-tbl .msz .x{padding:2px 5px;font-size:11px;color:#dc2626;border:none;background:none}
.sz-tbl .mini{margin-top:4px;font-size:11px;padding:3px 7px;border:1px dashed #94a3b8;background:#fff;border-radius:6px;color:#475569}
.sz-foot{font-size:13px;padding:6px 2px;color:#334155}
.sz-foot b{color:#8B2C3A}

<div class="topbar">
  <h1>🧵 百事达商行</h1>

    <input id="globalSearch" type="search" placeholder="🔍 搜唛头 / 订单号 / 款号 / 地址 / 备注…" autocomplete="off">

</div>

<div class="tabs" id="tabBar">

<script>
/* ========== 百事达商行 主脚本 ========== */
const DB_KEY='wmf_export_workbench_v1';
var DB={
  products:[], inventoryLog:[], orders:[], ledger:[], customers:[], packingLists:[], /* [NEW] 装箱单，确保初始即存在 */
  config:{
    sizeGroups:{adult:['S','M','L','XL','2XL','3XL'],child:[100,110,120,130,140,150,160,170],trouser:[28,29,30,31,32,33,34,35,36,38,40,42,44]},
    currencies:[{code:'CNY',symbol:'¥',name:'人民币'},{code:'USD',symbol:'$',name:'美元'},{code:'EUR',symbol:'€',name:'欧元'}],
    warehouses:['主仓库','车间暂存']
  }
};
var currentTab='products';

/* ---------- 持久化（云同步 + 本地兜底） ---------- */
const CACHE_KEY='wmf_cloud_cache_v1';
const TBL='wmf_data';   // Supabase 表名
var sbClient=null, cloudUser=null, cloudReady=false, cloudError=false, _syncTimer=null, _lastSync={};

function hasCloudConfig(){return !!window.SUPABASE_URL && !!window.SUPABASE_KEY}
function initSupabase(){
  if(!hasCloudConfig())return false;
  try{sbClient=window.supabase&&window.supabase.createClient?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY):null;return !!sbClient}
  catch(e){console.error('supabase init fail',e);return false}
}
function saveLocal(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(DB))}catch(e){console.warn('cache write fail',e)}}
function loadLocal(){try{const s=localStorage.getItem(CACHE_KEY);if(s){const d=JSON.parse(s);mergeDB(d)}}catch(e){console.warn('cache load fail',e)}}
function mergeDB(d){
  if(!d)return;
  DB.products=d.products||DB.products||[];
  DB.inventoryLog=d.inventoryLog||DB.inventoryLog||[];
  DB.orders=d.orders||DB.orders||[];
  DB.ledger=d.ledger||DB.ledger||[];
  DB.customers=d.customers||DB.customers||[];
  DB.packingLists=d.packingLists||DB.packingLists||[]; /* [NEW] 装箱单 */
  if(d.config)DB.config=Object.assign(DB.config,d.config);
}
/* 保存：总是先写本地缓存(立即生效)，再异步同步云端 */
function save(){
  saveLocal();
  updateMeta();
  if(cloudReady&&sbClient&&cloudUser){scheduleSync()}
  else if(hasCloudConfig()&&!cloudUser){cloudError=true;setSyncStatus('未登录')}
}
function scheduleSync(){
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(syncCloud,800);
}
async function syncCloud(){
  if(!sbClient||!cloudUser||!cloudReady)return;
  setSyncStatus('syncing','同步中…');
  try{
    const uid=cloudUser.id;
    const payload={user_id:uid,data:DB,updated_at:new Date().toISOString()};
    // upsert
    const {error}=await sbClient.from(TBL).upsert({user_id:uid,data:DB,updated_at:payload.updated_at},{onConflict:'user_id'});
    if(error)throw error;
    setSyncStatus('on','已同步到云端');
  }catch(e){cloudError=true;setSyncStatus('err','同步失败，已存本机');console.error('sync fail',e)}
}
async function loadCloud(){
  if(!sbClient||!cloudUser)return;
  setSyncStatus('syncing','读取云端…');
  try{
    const {data,error}=await sbClient.from(TBL).select('data,updated_at').eq('user_id',cloudUser.id).single();
    if(error&&error.code!=='PGRST116')throw error; // PGRST116=无记录
    if(data&&data.data){mergeDB(data.data);saveLocal();renderAll()}
    cloudReady=true;
    setSyncStatus('on','已连接云端');
    setupRealtime();
  }catch(e){cloudError=true;setSyncStatus('err','云端读取失败，用本地数据');console.error('load fail',e)}
}
function setupRealtime(){
  if(!sbClient||!cloudUser)return;
  try{
    const ch=sbClient.channel('wmf_sync');
    ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:TBL,filter:'user_id=eq.'+cloudUser.id},p=>{
      const nd=p.new&&p.new.data;
      if(nd&&(!_lastSync.user_id||_lastSync.user_id!==cloudUser.id)){mergeDB(nd);saveLocal();renderAll();setSyncStatus('on','已收到更新')}
      _lastSync={user_id:cloudUser.id};
    }).subscribe();
  }catch(e){console.warn('realtime fail',e)}
}
function setSyncStatus(cls,msg){const el=document.getElementById('syncStatus');if(!el)return;el.className='sync-status '+cls;el.textContent=msg}
function dbSchemaSQL(){
  // 供用户在 Supabase SQL Editor 执行的建表语句
  return `-- 1) 数据表（存储所有业务数据的 JSON）
create table if not exists public.wmf_data(
  user_id text primary key,
  data jsonb not null,
  updated_at timestamptz default now()
);
alter table public.wmf_data enable row level security;
create policy "own data" on public.wmf_data
  for all using (auth.uid()::text = user_id) with check (auth.uid()::text = user_id);

-- 2) 图片存储桶（product-images）的访问策略
insert into storage.buckets (id,name,public) values ('product-images','product-images',true)
  on conflict (id) do nothing;
create policy "public read images" on storage.objects
  for select using (bucket_id = 'product-images');
create policy "users upload own images" on storage.objects
  for insert with check (bucket_id = 'product-images' and auth.uid()::text = (storage.foldername(name))[1]);`;
}

/* ===== 登录 / 注册 ===== */
function switchLoginMode(){
  const isLogin=document.getElementById('loginForm').style.display!=='none';
  document.getElementById('loginForm').style.display=isLogin?'none':'block';
  document.getElementById('regForm').style.display=isLogin?'block':'none';
  document.getElementById('loginErr').style.display='none';
}
function showLoginErr(msg){const el=document.getElementById('loginErr');el.textContent=msg;el.style.display='block'}
function showLoginInfo(msg){const el=document.getElementById('loginInfo');el.textContent=msg;el.style.display='block'}
function withTimeout(p,ms,msg){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))])}
function sbFetch(path,body){
  return withTimeout(fetch(window.SUPABASE_URL+path,{
    method:'POST',cache:'no-store',
    headers:{'apikey':window.SUPABASE_KEY,'Authorization':'Bearer '+window.SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }),15000,'连接云服务器超时，请检查网络（WiFi/流量切换试试），或稍后重试');
}
function sbErrMsg(d,fallback){return (d&&(d.error_description||d.msg||d.message||d.error||d.code))||fallback}
async function doLogin(){
  if(!sbClient)return showLoginErr('云配置未就绪');
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass)return showLoginErr('请填写邮箱和密码');
  showLoginInfo('登录中…');document.getElementById('loginInfo').style.display='block';
  try{
    const r=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:pass});
    const d=await r.json();
    if(!r.ok||!d.access_token){showLoginErr(sbErrMsg(d,'登录失败('+r.status+')'));return}
    await withTimeout(sbClient.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token}), 8000, '设置登录态超时');
    onAuthSuccess(d.user);
  }catch(err){showLoginErr(err&&err.message||'连接失败，请检查网络')}
}
async function doRegister(){
  if(!sbClient)return showLoginErr('云配置未就绪');
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  if(!name)return showLoginErr('请填写你的名字');
  if(pass.length<6)return showLoginErr('密码至少 6 位');
  showLoginInfo('注册中…');document.getElementById('loginInfo').style.display='block';
  try{
    const r=await sbFetch('/auth/v1/signup',{email:email,password:pass,data:{display_name:name}});
    const d=await r.json();
    if(!r.ok){showLoginErr(sbErrMsg(d,'注册失败('+r.status+')'));return}
    showLoginInfo('注册成功！正在登录…');
    if(d.session&&d.session.access_token){
      await withTimeout(sbClient.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token}), 8000, '设置登录态超时');
      onAuthSuccess(d.user);
    }else{
      // 无 session（邮箱确认场景）：改用密码登录一次
      const r2=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:pass});
      const d2=await r2.json();
      if(!r2.ok||!d2.access_token){showLoginErr(sbErrMsg(d2,'注册后登录失败'));return}
      await withTimeout(sbClient.auth.setSession({access_token:d2.access_token,refresh_token:d2.refresh_token}), 8000, '设置登录态超时');
      onAuthSuccess(d2.user);
    }
  }catch(err){showLoginErr(err&&err.message||'连接失败，请检查网络')}
}
function onAuthSuccess(user){
  cloudUser=user;
  document.getElementById('loginMask').classList.remove('show');
  document.body.style.overflow='';
  toast('登录成功：'+(user.user_metadata&&user.user_metadata.display_name||user.email));
  loadCloud();
}
function doLogout(){
  if(!sbClient)return;
  sbClient.auth.signOut().then(()=>{cloudUser=null;cloudReady=false;showLogin()});
}
function showLogin(){
  document.getElementById('loginMask').classList.add('show');
  document.body.style.overflow='hidden';
}

/* ===== 修改登录密码 ===== */
function openPwdSheet(){
  if(!cloudUser)return toast('请先登录');
  openSheet('🔑 修改登录密码',`
    <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:10px;font-size:12px;color:#4338ca;margin-bottom:10px">
      当前账号：<b>${escapeHtml(cloudUser.email)}</b><br>
      <span style="color:#6b7280">改完后，所有登录这台账号的设备都要用新密码重新登录。</span>
    </div>
    <div class="field"><label>当前密码</label><input id="pw_old" type="password" placeholder="输入当前登录密码" autocomplete="current-password"></div>
    <div class="field"><label>新密码</label><input id="pw_new" type="password" placeholder="至少 6 位" autocomplete="new-password"></div>
    <div class="field"><label>确认新密码</label><input id="pw_new2" type="password" placeholder="再次输入新密码" autocomplete="new-password"></div>
    <div class="info" id="pwdInfo" style="display:none;background:#f6e2e6;color:#8B2C3A;border-radius:8px;padding:8px 10px;font-size:12px;margin-top:6px"></div>
  `,'保存新密码',()=>changePassword());
}
async function changePassword(){
  const old=$('pw_old').value;
  const n1=$('pw_new').value;
  const n2=$('pw_new2').value;
  if(!old)return toast('请填当前密码');
  if(n1.length<6)return toast('新密码至少 6 位');
  if(n1!==n2)return toast('两次输入的新密码不一致');
  // 1) 先验证当前密码：用当前密码重新登录拿 token（顺便证明旧密码正确）
  showPwdInfo('正在验证当前密码…');
  try{
    const email=cloudUser.email;
    const r=await sbFetch('/auth/v1/token?grant_type=password',{email:email,password:old});
    const d=await r.json();
    if(!r.ok||!d.access_token){return toast('当前密码不正确');}
    const access=d.access_token;
    // 2) 用该 token 调用更新密码
    showPwdInfo('正在更新密码…');
    const r2=await withTimeout(fetch(window.SUPABASE_URL+'/auth/v1/user',{
      method:'PUT',cache:'no-store',
      headers:{'apikey':window.SUPABASE_KEY,'Authorization':'Bearer '+access,'Content-Type':'application/json'},
      body:JSON.stringify({password:n1})
    }),15000,'连接云服务器超时');
    const d2=await r2.json();
    if(!r2.ok){return toast('修改失败：'+(d2.msg||d2.message||d2.error_description||d2.error||'('+r2.status+')'));}
    showPwdInfo('');closeSheet();
    toast('✅ 密码已修改！请用新密码重新登录');
    doLogout();
  }catch(err){showPwdInfo('');toast(err&&err.message||'修改失败，请检查网络')}
}
function showPwdInfo(msg){
  const el=$('pwdInfo');if(el){el.textContent=msg;el.style.display=msg?'block':'none'}
}

/* ===== 登录后主流程初始化 ===== */
function cloudBootstrap(){
  // 1. 尝试初始化 supabase
  const ok=initSupabase();
  if(!ok){
    // 无云配置：降级为本地版
    loadLocal();
    renderAll();
    return;
  }
  // 2. 读本地缓存立即显示
  loadLocal();
  renderAll();
  // 3. 检查登录态（加超时，防止 iOS Safari 中 SDK 挂起导致不弹登录框）
  withTimeout(sbClient.auth.getSession(), 8000, '登录态检查超时')
    .then(r=>{
      if(r.error){showLogin();return}
      if(r.data&&r.data.session){onAuthSuccess(r.data.session.user)}
      else{showLogin()}
    })
    .catch(err=>{
      console.warn('getSession fail/timeout', err);
      showLogin();
    });
}

/* ---------- 工具 ---------- */
function uid(prefix){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function toast(msg,ms=2000){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms)}
function fmtDate(d){if(!d)return'';d=String(d);if(/^\d{4}-\d{2}-\d{2}/.test(d))return d.slice(0,10);try{const dt=new Date(d);if(!isNaN(dt))return dt.toISOString().slice(0,10)}catch(e){}return d}
function todayStr(){return new Date().toISOString().slice(0,10)}
function num(v){v=parseFloat(v);return isNaN(v)?0:v}
function money(v,cur){const c=(DB.config.currencies.find(x=>x.code===cur)||DB.config.currencies[0]);return (c?c.symbol:'¥')+num(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function curSymbol(cur){const c=DB.config.currencies.find(x=>x.code===cur);return c?c.symbol:'¥'}
function productById(id){return DB.products.find(p=>p.id===id)}
function orderById(id){return DB.orders.find(o=>o.id===id)}
function customerById(id){return DB.customers.find(c=>c.id===id)}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderProducts(){
  const el=$('productList');
  if(!DB.products.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><div>暂无商品，点击右下角"＋"新增</div></div>';return}
  const saleOnly=DB.config.priceView==='sale';
  el.innerHTML=DB.products.map(p=>{
    const stock=parseInt(p.库存数)||0;
    const stockCls=stock<=0?'low':'';
    const colors=(p.颜色||[]).map(c=>`<span class="color-dot" style="background:${c.c||'#ccc'}" title="${escapeHtml(c.n||'')}"></span>`).join('');
    const img=p.款式图片?`<img src="${p.款式图片}" alt="">`:`<div class="ph">无图</div>`;
    const draftBadge=p.批量草稿?`<div class="draft-badge">待补全</div>`:'';
    return `<div class="prod-card" onclick="openProductSheet('${p.id}')">
      <div class="thumb">${img}${draftBadge}</div>
      <div class="stock ${stockCls}">库存 ${stock}</div>
      <div class="info">
        <div class="sn">${escapeHtml(p.款号)}</div>
        ${saleOnly?`<div class="price sale">售价 ¥${num(p.零售价||0).toFixed(2)}</div>`:`<div class="price">¥${num(p.工厂价).toFixed(2)}</div>`}
        <div class="colors">${colors||'<span style="font-size:11px;color:var(--muted)">无色</span>'}</div>
      </div>
    </div>`;
  }).join('');
  const sw=document.getElementById('priceViewSwitch');if(sw)sw.classList.toggle('on',DB.config.priceView==='sale');
}

function renderColorChips(){const arr=window._curColors||[];$('colorChips').innerHTML=arr.length?arr.map((c,i)=>`<span class="color-chip"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.c||'#ccc'};border:1px solid rgba(0,0,0,.1)"></span>${escapeHtml(c.n)}<span class="rm" onclick="rmColor(${i})">×</span></span>`).join(''):'<span style="font-size:12px;color:var(--muted)">无</span>'}
function previewImg(input,id){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{let dataUrl=e.target.result;compressImg(dataUrl,800,0.8,cp=>{window._pendingImg=cp;$('imgPreview').innerHTML=`<img src="${cp}" style="max-width:120px;border-radius:6px">`;toast('图片已压缩，保存时上传')})};r.readAsDataURL(f)}
function compressImg(dataUrl,maxSize,quality,cb){const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height));const w=img.width*scale,h=img.height*scale;const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',quality))};img.src=dataUrl}

/* ===== 批量建款 / 补录视图 / OCR 吊牌 ===== */
function readFileAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function nextBatchCode(){
  let max=0;
  DB.products.forEach(p=>{const m=/^BSD-(\d+)$/.exec((p.款号||'').trim());if(m)max=Math.max(max,parseInt(m[1]))});
  return 'BSD-'+String(max+1).padStart(4,'0');
}
async function batchCreateFromImages(input){
  const files=Array.from(input.files||[]);
  input.value='';
  if(!files.length)return;
  toast('正在压缩 '+files.length+' 张图片…');
  const ids=[];
  for(const f of files){
    const dataUrl=await readFileAsDataURL(f);
    const cp=await new Promise(res=>compressImg(dataUrl,800,0.8,res));
    const np={id:uid('p'),款号:nextBatchCode(),颜色:[],工厂价:0,零售价:0,sizeGroup:'adult',尺码组:DB.config.sizeGroups.adult.slice(),库存数:0,autoSync:true,款式图片:cp,备注:'批量相册建款',批量草稿:true,createdAt:Date.now(),updatedAt:Date.now()};
    DB.products.push(np);ids.push(np.id);
  }
  save();renderProducts();
  toast('已建 '+ids.length+' 件商品，进入补录');
  openBatchFill(ids);
}
function openBatchFill(ids){
  window._batchIds=ids;window._batchIdx=0;

function saveBatchItem(goNext){
  const id=window._batchIds[window._batchIdx];const p=productById(id);if(!p)return;
  p.款号=($('bf_款号').value||'').trim();
  p.工厂价=num($('bf_工厂价').value);
  p.零售价=num($('bf_零售价').value);
  p.库存数=parseInt($('bf_库存数').value)||0;
  p.备注=($('bf_备注').value||'').trim();
  const cols=($('bf_颜色').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  p.颜色=cols.map(n=>({n,c:'#888'}));
  if(p.款号)p.批量草稿=false;
  p.updatedAt=Date.now();
  save();renderProducts();
  if(goNext){
    if(window._batchIdx<window._batchIds.length-1){window._batchIdx++;renderBatchItem();}
    else{$('batchFillBody').innerHTML='<div style="text-align:center;color:var(--muted);padding:20px">已全部过完 ✅<br>未填款的留作草稿，可稍后在商品档案补</div>';toast('已全部补录完成 ✅')}
  }
}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('脚本加载失败'));document.head.appendChild(s)})}
async function ensureTesseract(){if(window.Tesseract)return window.Tesseract;await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');return window.Tesseract}
async function ocrLabel(input){
  const f=input.files[0];input.value='';if(!f)return;
  const hint=$('ocrHint');if(hint)hint.textContent='吊牌识别中…（首次需联网下载识别引擎，请稍候）';
  try{
    const T=await ensureTesseract();
    const dataUrl=await readFileAsDataURL(f);
    const {data:{text}}=await T.recognize(dataUrl,'chi_sim',{logger:()=>{}});
    let code='';
    const m1=text.match(/[A-Za-z]{1,4}[-\s]?\d{2,}/);if(m1)code=m1[0].replace(/\s/g,'');
    const m2=text.match(/款号[：:]\s*([A-Za-z0-9\-]+)/i);if(m2)code=m2[1];
    let price='';
    const m3=text.match(/[¥￥]\s*(\d+(?:\.\d+)?)/);if(m3)price=m3[1];
    else{const m4=text.match(/价[：:]?\s*(\d+(?:\.\d+)?)/);if(m4)price=m4[1];}
    if(code&&$('bf_款号'))$('bf_款号').value=code;
    if(price&&$('bf_零售价'))$('bf_零售价').value=price;
    let recog=[];if(code)recog.push('款号 '+code);if(price)recog.push('价格 ¥'+price);
    const recogTxt=recog.join(' ');
    if(hint)hint.innerHTML='已识别：'+(recogTxt?('<b>'+escapeHtml(recogTxt)+'</b>'):'')+'<br><span style="opacity:.7">原文：'+escapeHtml(text.slice(0,140))+'</span><br>请核对后保存';
    toast(code||price?'OCR 已填入，请核对':'OCR 未识别到款号/价格，请手动填');
  }catch(e){if(hint)hint.textContent='OCR 不可用（需联网加载识别引擎），请手动填写。';toast('OCR 加载失败，请手动填')}
}
/* 上传压缩图到 Supabase Storage，返回公开 URL */
async function uploadImageToCloud(dataUrl){
  if(!sbClient||!cloudUser||!dataUrl)return dataUrl;
  const base64=dataUrl.split(',')[1];
  const bin=atob(base64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  const ext='jpg';
  const path=cloudUser.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,6)+'.'+ext;
  const {error}=await sbClient.storage.from('product-images').upload(path,arr,{contentType:'image/jpeg',upsert:false});
  if(error){console.error('img upload fail',error);toast('图片上传失败：'+error.message);return dataUrl}
  const {data:publ}=sbClient.storage.from('product-images').getPublicUrl(path);
  return publ?publ.publicUrl:dataUrl;
}
function saveProduct(id){
  const 款号=$('p_款号').value.trim();if(!款号)return toast('款号必填');
  const sizeGroup=$('p_sizeGroup').value;
  const 尺码组=$('p_尺码组').value.split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!==null);
  const data={款号,颜色:window._curColors||[],工厂价:num($('p_工厂价').value),零售价:num($('p_零售价').value),sizeGroup,尺码组,库存数:num($('p_库存数').value),autoSync:$('p_autoSync').classList.contains('on'),备注:$('p_备注').value.trim()};
  const pending=window._pendingImg;
  if(pending){
    // 有新图：先上传再保存
    uploadImageToCloud(pending).then(url=>{data.款式图片=url;finishSaveProduct(id,data)});
  }else{
    const imgPrev=$('imgPreview').querySelector('img');
    if(imgPrev)data.款式图片=imgPrev.src;
    finishSaveProduct(id,data);
  }
}
function finishSaveProduct(id,data){
  if(id){const p=productById(id);Object.assign(p,data);p.updatedAt=Date.now()}else{data.id=uid('p');data.createdAt=Date.now();DB.products.push(data)}
  window._pendingImg=null;
  save();renderProducts();closeSheet();toast('已保存');
}

/* ============ 客户档案 ============ */
function customerOrders(c){return DB.orders.filter(o=>o.客户id===c.id||o.唛头===c.名称)}
function customerBalance(c){
  // 预付款余额：客户存入 - 代付/订单扣减
  let bal=num(c.预付款||0);
  (DB.ledger||[]).forEach(r=>{if(r.客户id===c.id||r.对方===c.名称){if(r.类型==='income')bal+=num(r.金额);else bal-=num(r.金额)}});
  return bal;
}
function renderCustomers(){
  const el=$('customerList');
  if(!DB.customers.length){el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><div>暂无客户，点击右上角"＋ 新增客户"建立档案</div></div>';return}
  const q=(window._custSearch||'').toLowerCase();
  let list=DB.customers;
  if(q)list=list.filter(c=>[c.名称,c.电话,c.地址,c.备注].join(' ').toLowerCase().includes(q));
  const sorted=[...list].sort((a,b)=>(a.名称||'').localeCompare(b.名称||'','zh'));
  el.innerHTML=`<div style="display:flex;gap:6px;margin-bottom:10px"><input id="custSearch" placeholder="🔍 搜客户名称/电话/地址…" value="${escapeHtml(window._custSearch||'')}" oninput="window._custSearch=this.value;renderCustomers()" style="flex:1;padding:9px 11px;border:1px solid var(--border);border-radius:8px"></div>`+
  (sorted.length?`<div class="grid">`+sorted.map(c=>{
    const orders=customerOrders(c);
    const ordersCnt=orders.length;
    const itemsCnt=orders.reduce((s,o)=>s+(o.items||[]).reduce((x,i)=>x+num(i.数量),0),0);
    const bal=customerBalance(c);
    return`<div class="prod-card" onclick="openCustomerDetail('${c.id}')">
      <div class="info">
        <div class="sn">${escapeHtml(c.名称||'未命名')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">${ordersCnt} 个订单 · 共 ${itemsCnt} 件</div>
        <div class="price" style="margin-top:4px;font-size:12px">余额 ${money(bal,c.币种||'CNY')}</div>
      </div>
    </div>`;
  }).join('')+`</div>`:`<div class="empty">未找到匹配客户</div>`);
}

function syncProdInfo(){const pid=$('i_款号id').value;const p=productById(pid);const cSel=$('i_颜色'),sSel=$('i_尺码');if(!p){cSel.innerHTML='<option value="">—</option>';sSel.innerHTML='<option value="">—</option>';return}cSel.innerHTML=(p.颜色||[]).map(c=>`<option value="${escapeHtml(c.n)}">${escapeHtml(c.n)}</option>`).join('')||'<option value="">—</option>';sSel.innerHTML=(p.尺码组||[]).map(s=>`<option value="${s}">${s}</option>`).join('')||'<option value="">—</option>'}
function saveInventory(id,orig){
  const 款号id=$('i_款号id').value;if(!款号id)return toast('请选款号');
  const data={日期:$('i_日期').value||todayStr(),类型:$('i_类型').value,款号id,颜色:$('i_颜色').value,尺码:$('i_尺码').value,数量:num($('i_数量').value),关联订单id:$('i_关联订单id').value,仓库:$('i_仓库').value,经手人:$('i_经手人').value,备注:$('i_备注').value.trim()};
  const p=productById(款号id);if(p)data.款号快照=p.款号;
  if(!data.数量||data.数量<=0)return toast('数量必须>0');
  // 库存联动：原记录的影响先回滚，再应用新记录
  if(id&&p&&p.autoSync){
    const origSign=orig.类型==='in'?+num(orig.数量):-num(orig.数量);
    p.库存数=num(p.库存数)-origSign;
  }
  if(id){Object.assign(orig,data);orig.updatedAt=Date.now()}else{data.id=uid('i');data.createdAt=Date.now();DB.inventoryLog.push(data)}
  if(p&&p.autoSync){const sign=data.类型==='in'?+data.数量:-data.数量;p.库存数=num(p.库存数)+sign}
  save();renderInventory();closeSheet();toast('已保存');
}
function deleteInventory(id){const r=DB.inventoryLog.find(x=>x.id===id);if(!r)return;const p=productById(r.款号id);if(p&&p.autoSync){const sign=r.类型==='in'?-num(r.数量):+num(r.数量);p.库存数=num(p.库存数)+sign}DB.inventoryLog=DB.inventoryLog.filter(x=>x.id!==id);save();renderInventory();closeSheet();toast('已删除')}

  el.innerHTML=`<table class="tbl"><thead><tr><th>订单号</th><th>唛头</th><th>日期</th><th>币种</th><th>件数</th><th>总金额</th><th>类型</th></tr></thead><tbody>

function orderTotal(o){const sub=(o.items||[]).reduce((s,i)=>s+num(i.数量)*num(i.单价),0);const fm=o.运费模式==='self'?'self':'our';const fr=fm==='self'?0:num(o.运费);return sub+fr+num(o.其他费用)} /* [MOD] 兼容运费模式，旧单默认计入应收 */
function orderGoodsTotal(o){return (o.items||[]).reduce((s,i)=>s+num(i.数量)*num(i.单价),0)} /* [NEW] 订单总金额（货款，不含运费/其他） */
/* [MOD] 订单编辑：头部 11 字段(改标签+新增) + 全局隐藏金额开关 + 财务区 + 打印入口 */

    /* [NEW] 头部新增字段 */ 客户电话:'',国家地区:'',出货日期:'',付款方式:'',内部备注:'',

/* 把 flat items（旧数据/展开后）按 款号 归组，款号下按颜色分块 */
function groupFlatItems(items){
  const map={};
  (items||[]).forEach(it=>{
    const p=productById(it.款号id);
    const gkey=it.款号id||it.款号快照||it.款号||'';
    if(!map[gkey])map[gkey]={款号id:it.款号id||'',款号快照:it.款号快照||(p?p.款号:'')||'',款号:p?p.款号:(it.款号快照||''),单价:num(it.单价),品名:it.品名||'',无尺码:false,总件数:0,颜色组:[]}; /* [NEW] 品名/无尺码 */
    const g=map[gkey];
    const c=it.颜色||'';
    let cg=g.颜色组.find(x=>x.颜色===c);
    if(!cg){cg={颜色:c,码数:{},_userEdited:true,模式:'detail',起码:'',止码:'',尺码范围:it.尺码范围||''};g.颜色组.push(cg);} /* [NEW] 尺码范围 */
    // 恢复范围模式元数据（范围模式下允许填总数重新均分）
    if(it._范围){cg.模式='range';cg.起码=it._起码||'';cg.止码=it._止码||'';cg._userEdited=false;}
    cg.码数[it.尺码]=num(it.数量);
  });
  return Object.values(map);
}
/* 把 groups 展开回 flat items（每尺码一行）。新结构：一个款号下多个颜色 */
function expandGroups(groups){
  const items=[];
  (groups||[]).forEach(g=>{
    const 款号id=g.款号id||'';
    const p=productById(款号id);
    const 款号快照=p?p.款号:(g.款号||g.款号快照||'');
    /* [NEW] 无尺码快速录入：整款只录总件数，展开为一条汇总 item */
    if(g.无尺码){const qty=num(g.总件数);if(qty>0)items.push({款号id,款号快照,颜色:'',尺码:'',数量:qty,单价:num(g.单价),品名:g.品名||''});return;}
    (g.颜色组||(g.颜色?[{颜色:g.颜色,码数:g.码数}]:[])).forEach(cg=>{
      // 均码模式：整行只录总件数，展开为一条汇总记录（与分码数据并存）
      if(parseSizeRange(cg.尺码范围)==='__FREE__'){
        const qty=num(cg.均码件数);
        if(qty>0)items.push({款号id,款号快照,颜色:cg.颜色||'',尺码:'',数量:qty,单价:num(g.单价),品名:g.品名||''});
        return;
      }
      const szKeys=Object.keys(cg.码数||{});
      szKeys.forEach((sz,idx)=>{
        const qty=num(cg.码数[sz]);if(qty<=0)return;
        const it={款号id,款号快照,颜色:cg.颜色||'',尺码:sz,数量:qty,单价:num(g.单价),品名:g.品名||''};
        // 范围模式：在首行附加元数据，供回看恢复折叠显示
        if(cg.模式==='range'&&idx===0&&szKeys.length>1){it._范围=true;it._起码=cg.起码;it._止码=cg.止码;}
        items.push(it);
      });
    });
  });
  return items;
}

function colorQty(cg){if(parseSizeRange(cg.尺码范围||'')==='__FREE__')return num(cg.均码件数);return Object.values(cg.码数||{}).reduce((s,v)=>s+num(v),0)}
/* 范围模式的尺码列表：从商品尺码组里取 起码~止码 之间的码。手打的码若不在尺码组里也接受 */
function rangeSizes(p,cg){
  if(!p||!p.尺码组||!p.尺码组.length){
    // 无尺码组时，起码/止码作为两个独立尺码去重
    const arr=[];
    if(cg.起码)arr.push(cg.起码);
    if(cg.止码&&cg.止码!==cg.起码)arr.push(cg.止码);
    return arr;
  }
  const from=cg.起码||'',to=cg.止码||'';
  if(!from&&!to)return [];
  if(from===to)return [from];
  const arr2=p.尺码组.map(String);
  const sIdx=arr2.indexOf(String(from)),eIdx=arr2.indexOf(String(to));
  if(sIdx>=0&&eIdx>=0){
    const lo=Math.min(sIdx,eIdx),hi=Math.max(sIdx,eIdx);
    return p.尺码组.slice(lo,hi+1);
  }
  // 起码/止码至少有一个不在尺码组：把它们作为起止两点，中间无法确定则只保留这两点
  const arr=[];
  if(from)arr.push(from);
  if(to&&to!==from)arr.push(to);
  return arr;
}

/* 把 total 均分到 sizes 各码，写入 cg.码数。force=是否无视 _userEdited */
function distributeToSizes(cg,sizes,total,force){
  if(sizes.length===1){cg.码数={};cg.码数[sizes[0]]=total;cg._userEdited=false;return}
  const base=Math.floor(total/sizes.length),rem=total%sizes.length;
  cg.码数={};
  sizes.forEach((sz,k)=>{cg.码数[sz]=base+(k<rem?1:0)});
  cg._userEdited=false;
}


/* ============ [NEW] 尺码范围解析（无商品前置条件，开放式手打） ============ */
const STD_SIZES=['S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL','8XL'];
function parseSizeRange(range){
  if(!range)return [];
  const r=String(range).trim();
  const low=r.toLowerCase();
  if(['均码','free','f','freesize','free size','均码数'].includes(low))return '__FREE__';
  const sep=r.includes('~')?'~':(r.includes('–')||r.includes('—')?'–':'-');
  const parts=r.split(sep).map(x=>x.trim()).filter(Boolean);
  if(parts.length<=1)return parts.length?[parts[0]]:[];
  const from=parts[0],to=parts[parts.length-1];
  const sIdx=STD_SIZES.indexOf(from),eIdx=STD_SIZES.indexOf(to);
  if(sIdx>=0&&eIdx>=0){const lo=Math.min(sIdx,eIdx),hi=Math.max(sIdx,eIdx);return STD_SIZES.slice(lo,hi+1);}
  return [from,to];
}
function styleColumns(g){
  const set=[];
  (g.颜色组||[]).forEach(cg=>{const p=parseSizeRange(cg.尺码范围);if(Array.isArray(p))p.forEach(x=>{if(!set.includes(x))set.push(x);});});
  set.sort((a,b)=>STD_SIZES.indexOf(a)-STD_SIZES.indexOf(b));
  return set;
}
function styleColumnsAll(g){
  const set=styleColumns(g);
  (g.款式尺码||[]).forEach(x=>{if(!set.includes(x))set.push(x);});
  set.sort((a,b)=>STD_SIZES.indexOf(a)-STD_SIZES.indexOf(b));
  return set;
}

function onProdInput(i,val,blur){
  const g=window._orderGroups[i];
  val=(val||'').trim();
  // 尝试匹配商品款号（先精确，再模糊）
  const p=DB.products.find(x=>x.款号===val)||DB.products.find(x=>x.款号.toLowerCase().includes(val.toLowerCase()));
  if(p){g.款号id=p.id;g.款号=p.款号;g.款号快照=p.款号;const cg=cgOf(g,0);if(!cg.颜色)cg.颜色=(p.颜色&&p.颜色[0])?p.颜色[0].n:'';if(!num(g.单价))g.单价=num(p.工厂价);if(!Object.keys(cg.码数||{}).length)cg.码数={};}
  else{g.款号id='';g.款号=val;g.款号快照=val;const cg=cgOf(g,0);cg.码数=cg.码数||{};if(blur)autoCreateProduct(i,val);}
  renderOrderItems();recalcOrder();
}
function onColorInput(i,j,val){const g=window._orderGroups[i];const cg=cgOf(g,j);cg.颜色=(val||'').trim();recalcOrder()}
/* 订单录入未知款号 → 失焦自动建档（空壳，后续去商品补全尺码/图片） */
function autoCreateProduct(i,val){
  val=(val||'').trim();if(!val)return;
  const g=window._orderGroups[i];
  // 再次确认档案里没有（精确+模糊），避免与已有款号重复建
  const exist=DB.products.find(x=>x.款号===val)||DB.products.find(x=>x.款号.toLowerCase().includes(val.toLowerCase()));
  if(exist){g.款号id=exist.id;g.款号=exist.款号;g.款号快照=exist.款号;return;}
  const np={id:uid('p'),款号:val,颜色:[],工厂价:0,零售价:0,sizeGroup:'adult',尺码组:DB.config.sizeGroups.adult.slice(),库存数:0,autoSync:true,款式图片:'',自动建档:true,备注:'订单自动建档',createdAt:Date.now(),updatedAt:Date.now()};
  DB.products.push(np);
  g.款号id=np.id;g.款号=val;g.款号快照=val;
  save();renderProducts();
  toast('已自动建档：'+val+'（去「商品」补全尺码/图片）');
}
/* 订单界面查看款式图：有图看大图，无图引导去商品补传 */

    return;
  }
  if(p){
    openSheet('款式图片 · '+escapeHtml(p.款号),`<div style="text-align:center;color:var(--muted)"><div style="font-size:40px;margin-bottom:6px">🖼️</div><div style="margin-bottom:10px">该款暂无款式图片</div><button class="btn btn-primary" onclick="closeSheet();jumpTo('products','${p.id}')">去商品档案上传图片</button></div>`,null);
  }else{
    toast('该款尚未建档，先填款号并失焦自动建档');

}
function onPriceInput(i,val){window._orderGroups[i].单价=num(val);updateGroupSub(i);recalcOrder()}

/* ============ [NEW] 表格化录入交互 ============ */
function onCellQty(i,j,sz,val){
  const g=window._orderGroups[i];const cg=cgOf(g,j);if(!cg.码数)cg.码数={};
  cg.码数[sz]=num(val);cg._userEdited=true;updateColorRow(i,j);recalcOrder();
}
function onManualQty(i,j,sz,val){
  const g=window._orderGroups[i];const cg=cgOf(g,j);if(!cg.码数)cg.码数={};
  cg.码数[sz]=num(val);updateColorRow(i,j);recalcOrder();
}
function renameManualSize(i,j,old,newName){
  const g=window._orderGroups[i];const cg=cgOf(g,j);if(!cg.码数)cg.码数={};
  newName=(newName||'').trim();if(!newName||newName===old||!(old in cg.码数))return;
  const v=cg.码数[old];delete cg.码数[old];cg.码数[newName]=v;renderOrderItems();recalcOrder();
}
function rmManualSize(i,j,sz){
  const g=window._orderGroups[i];const cg=cgOf(g,j);if(cg.码数&&sz in cg.码数)delete cg.码数[sz];renderOrderItems();recalcOrder();
}
function addManualSize(i,j){
  const g=window._orderGroups[i];const cg=cgOf(g,j);if(!cg.码数)cg.码数={};
  let k='新码',n=1;while(k in cg.码数){k='新码'+(++n);}
  cg.码数[k]=0;renderOrderItems();recalcOrder();
}
function addStyleSize(i){
  const g=window._orderGroups[i];if(!g.款式尺码)g.款式尺码=[];
  const all=styleColumnsAll(g);
  const present=all.filter(s=>STD_SIZES.includes(s));
  let next;
  if(present.length){
    const maxIdx=Math.max.apply(null,present.map(s=>STD_SIZES.indexOf(s)));
    next=STD_SIZES[maxIdx+1]||(''+(maxIdx-3+2)+'XL');
    if(!next)next='9XL';
  }else{next='S';}
  g.款式尺码.push(next);renderOrderItems();recalcOrder();toast('已新增尺码列：'+next);
}
function updateColorRow(i,j){
  const g=window._orderGroups[i];const cg=g.颜色组?g.颜色组[j]:null;if(!cg)return;
  const rows=document.querySelectorAll('.cgr');const row=rows[j];if(!row)return;
  const qty=colorQty(cg);const cur=$('o_币种')?$('o_币种').value:'CNY';
  const c=row.querySelector('.c-cnt');if(c)c.textContent=qty;
  const x=row.querySelector('.c-sub');if(x)x.textContent=money(qty*num(g.单价),cur);
}
function onSizeRangeChange(i,j,val){
  const cg=cgOf(window._orderGroups[i],j);cg.尺码范围=(val||'').trim();
  renderOrderItems();recalcOrder();
}

/* 尺码数量：si 为下标。已录商品按尺码组下标取尺码名；未录商品按码数键顺序取 */
function onSizeQty(i,j,si,val){
  const g=window._orderGroups[i];const cg=cgOf(g,j);const p=g.款号id?productById(g.款号id):null;if(!cg.码数)cg.码数={};
  if(p&&p.尺码组&&p.尺码组.length){cg.码数[p.尺码组[si]]=num(val)}
  else{const keys=Object.keys(cg.码数);const sz=keys[si]!==undefined?keys[si]:'';cg.码数[sz]=num(val)}
  cg._userEdited=true; // 用户手动改过，之后不自动均分覆盖
  updateGroupSub(i);recalcOrder();
}
/* 填该颜色总件数：若用户还没手动微调过，则自动平均分配到各码（就地更新，不重建输入框以免失焦） */
function onTotalQty(i,j,val){
  const g=window._orderGroups[i];const cg=cgOf(g,j);
  const parsed=parseSizeRange(cg.尺码范围);
  const total=num(val);
  if(total<=0)return;
  if(parsed==='__FREE__'){ // 均码：整行只录总件数，独立字段与分码并存
    cg.均码件数=total;updateColorRow(i,j);recalcOrder();return;
  }
  const sizes=Array.isArray(parsed)?parsed:Object.keys(cg.码数||{});
  if(!sizes.length)return;
  const manual={};Object.keys(cg.码数||{}).forEach(k=>{if(!sizes.includes(k))manual[k]=cg.码数[k];});
  cg.码数=manual;
  if(sizes.length===1){cg.码数[sizes[0]]=total;}
  else{const base=Math.floor(total/sizes.length),rem=total%sizes.length;sizes.forEach((sz,k)=>{cg.码数[sz]=base+(k<rem?1:0)});}
  sizes.forEach(sz=>{const el=document.getElementById('szc_'+i+'_'+j+'_'+sz);if(el)el.value=cg.码数[sz];});
  updateColorRow(i,j);recalcOrder();
}
/* 平均分配按钮：把该颜色总数重新均分（覆盖用户微调） */
function avgDistribute(i,j){
  const g=window._orderGroups[i];const cg=cgOf(g,j);
  const parsed=parseSizeRange(cg.尺码范围);
  const sizes=parsed==='__FREE__'?[]:(Array.isArray(parsed)?parsed:Object.keys(cg.码数||{}));
  if(!sizes.length)return toast('请先填写尺码范围');
  const total=colorQty(cg)||0;
  if(total<=0)return toast('请先填该颜色总件数');
  const manual={};Object.keys(cg.码数||{}).forEach(k=>{if(!sizes.includes(k))manual[k]=cg.码数[k];});
  cg.码数=manual;
  if(sizes.length===1){cg.码数[sizes[0]]=total;}
  else{const base=Math.floor(total/sizes.length),rem=total%sizes.length;sizes.forEach((sz,k)=>{cg.码数[sz]=base+(k<rem?1:0)});}
  cg._userEdited=true;renderOrderItems();recalcOrder();toast('已平均分配到各码');
}
function onSizeName(i,j,si,val){
  const g=window._orderGroups[i];const cg=cgOf(g,j);const keys=Object.keys(cg.码数||{});const old=keys[si];
  if(old===undefined){cg.码数[val.trim()]='';}
  else{const qty=cg.码数[old];delete cg.码数[old];cg.码数[val.trim()]=qty;}
  renderOrderItems();
}
function addCustomSize(i,j){const g=window._orderGroups[i];const cg=cgOf(g,j);if(!cg.码数)cg.码数={};cg.码数['']='';renderOrderItems()}
function updateGroupSub(i){const g=window._orderGroups[i];const el=$('it_sub_'+i);if(el)el.value=(groupQty(g)*num(g.单价)).toFixed(2)} /* [MOD] 用 groupQty 兼容无尺码模式 */
function groupQty(g){if(g.无尺码)return num(g.总件数||0);return (g.颜色组||(g.颜色?[{颜色:g.颜色,码数:g.码数}]:[])).reduce((s,c)=>s+colorQty(c),0)} /* [MOD] 无尺码取总件数 */
/* [MOD] 按需触发：只更新财务摘要/尾款，不重建商品明细表（解决卡顿）；兼容运费模式 */
function recalcOrder(){
  const groups=window._orderGroups||[];
  const goods=groups.reduce((s,g)=>s+groupQty(g)*num(g.单价),0);
  const cnt=groups.reduce((s,g)=>s+groupQty(g),0);
  const cur=$('o_币种')?$('o_币种').value:'CNY';
  const fmEl=$('freightMode');const fm=(fmEl&&fmEl.querySelector('.on'))?fmEl.querySelector('.on').dataset.mode:'our';
  const freight=num($('o_运费')?$('o_运费').value:0);
  const other=num($('o_其他费用')?$('o_其他费用').value:0);
  const freightCounted=fm!=='self'?freight:0;
  const receivable=goods+freightCounted+other;
  const deposit=num($('o_定金')?$('o_定金').value:0);
  const balance=receivable-deposit;
  // 货币符号同步
  ['o_freightSym','o_otherSym','o_depSym','o_balSym'].forEach(id=>{const e=$(id);if(e)e.textContent=curSymbol(cur)});
  const fg=$('finGoods');if(fg)fg.innerHTML=`<div style="display:flex;justify-content:space-between"><span>订单总金额（货款）</span><b>${money(goods,cur)}</b></div><div style="display:flex;justify-content:space-between;color:var(--muted)"><span>总件数</span><span>${cnt} 件</span></div>`;
  const fr=$('finReceivable');if(fr)fr.innerHTML=`<div style="display:flex;justify-content:space-between"><span>运费${fm==='self'?'（客户自理·不计）':'（我方代付·计入）'}</span><b>${money(freightCounted,cur)}</b></div><div style="display:flex;justify-content:space-between"><span>其他费用</span><b>${money(other,cur)}</b></div><div style="display:flex;justify-content:space-between;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)"><span style="font-weight:600">应收总额</span><b style="color:var(--primary);font-size:15px">${money(receivable,cur)}</b></div>`;
  const bal=$('o_尾款');if(bal)bal.value=balance.toFixed(2);
  const os=$('orderSummary');if(os)os.innerHTML=`<div style="display:flex;justify-content:space-between"><span>应收总额</span><b>${money(receivable,cur)}</b></div>`;
}
/* [MOD] 改用 collectOrder 统一收集（含新增字段/财务区/丰富结构 styles） */
function saveOrder(id){
  const data=collectOrder(id);
  if(!data.订单号)return toast('合同单号必填');
  if(!data.唛头)return toast('客户名称（唛头）必填');
  if(!data.items.length)return toast('至少填一个尺码数量（数量要>0）');
  if(id){const o=orderById(id);Object.assign(o,data);o.updatedAt=Date.now()}else{data.id=uid('o');data.createdAt=Date.now();DB.orders.push(data)}
  save();renderOrders();closeSheet();toast('已保存');
}
function deleteOrder(id){DB.orders=DB.orders.filter(o=>o.id!==id);DB.inventoryLog=DB.inventoryLog.filter(r=>r.关联订单id!==id);save();renderOrders();closeSheet();toast('已删除订单')}

/* ============ [NEW] 订单辅助：克隆 / 规范化 / 收集 / 开关 ============ */
function cloneGroups(g){try{return JSON.parse(JSON.stringify(g||[]))}catch(e){return[]}}
function normalizeGroups(groups){
  (groups||[]).forEach(g=>{
    if(g.品名===undefined)g.品名='';
    if(g.无尺码===undefined)g.无尺码=false;
    if(g.总件数===undefined)g.总件数=0;
    if(!g.颜色组||!g.颜色组.length)g.颜色组=[newColorCg()];
    g.颜色组.forEach(cg=>{if(cg.尺码范围===undefined)cg.尺码范围='';if(!cg.码数)cg.码数={};if(!cg.模式)cg.模式='detail'});
  });
}
function toggleHideAmount(){DB.config.hideAmount=!DB.config.hideAmount;save();const sw=$('o_hideAmount');if(sw)sw.classList.toggle('on',DB.config.hideAmount);toast(DB.config.hideAmount?'已开启：打印将隐藏单价与金额':'已关闭：打印完整展示价格')}
function setFreightMode(mode){
  const wrap=$('freightMode');if(!wrap)return;
  wrap.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  const fw=$('freightWrap');if(fw)fw.classList.toggle('dim-input',mode==='self'); /* [NEW] 客户自理时置灰运费 */

function renderContractPreview(o){
  const hide=!!DB.config.hideAmount; /* [NEW] 全局隐藏金额开关 */
  const cur=o.币种||'CNY';
  const groups = o.styles ? (function(){const c=cloneGroups(o.styles);normalizeGroups(c);return c;})() : groupFlatItems(o.items);
  let rows='';
  groups.forEach(g=>{
    const p=g.款号id?productById(g.款号id):null;
    const 品名=g.品名||(p?p.款号:g.款号快照)||g.款号||'';
    if(g.无尺码){
      const qty=num(g.总件数);const sub=qty*num(g.单价);
      rows+=`<tr><td>${escapeHtml(品名||g.款号||'')}</td><td>${escapeHtml(g.款号||'')}</td><td>—</td><td>${qty}</td>${hide?'':'<td>'+money(num(g.单价),cur)+'</td><td>'+money(sub,cur)+'</td>'}</tr>`;
      return;
    }
    (g.颜色组||[]).forEach(cg=>{
      const sizeKeys=Object.keys(cg.码数||{}).filter(k=>num(cg.码数[k])>0);
      const qty=colorQty(cg);const sub=qty*num(g.单价);
      const sizes=sizeKeys.map(k=>k+':'+cg.码数[k]).join(' / ');
      rows+=`<tr><td>${escapeHtml(品名||'')}</td><td>${escapeHtml(g.款号||'')}</td><td>${escapeHtml((cg.颜色||'')+(cg.尺码范围?' ('+cg.尺码范围+')':''))}</td><td>${qty}${sizes?'<br><span style="font-size:10px;color:#666">'+escapeHtml(sizes)+'</span>':''}</td>${hide?'':'<td>'+money(num(g.单价),cur)+'</td><td>'+money(sub,cur)+'</td>'}</tr>`;
    });
  });
  const goods=orderGoodsTotal(o);
  const fm=o.运费模式==='self'?'self':'our';
  const freightCounted=fm==='self'?0:num(o.运费);
  const receivable=goods+freightCounted+num(o.其他费用);
  const colHead = hide ? '<th>品名/Description</th><th>款号/Item</th><th>颜色·尺码范围</th><th>数量/QTY</th>' : '<th>品名/Description</th><th>款号/Item</th><th>颜色·尺码范围</th><th>数量/QTY</th><th>单价/U.Price</th><th>小计/Amount</th>';
  const finBlock = hide ? '' : `<div class="c-foot">订单总金额（货款）：${money(goods,cur)}<br>运费（${fm==='self'?'客户自理·不计':'我方代付·计入'}）：${money(freightCounted,cur)} · 其他费用：${money(num(o.其他费用),cur)}<br><b>应收总额：${money(receivable,cur)}</b> · 定金：${money(num(o.定金),cur)} · 尾款：${money(num(o.尾款),cur)}<br>收款状态：${escapeHtml(o.收款状态||'')}</div>`;
  const html=`<div class="contract">
    <h2>SALES CONTRACT / 销售合同</h2>
    <div class="c-sub">${hide?'（客户无价版 · 单价与金额已隐藏）':''}</div>
    <div class="c-head">
      <div>合同单号：${escapeHtml(o.订单号||'')}</div>
      <div>下单日期：${escapeHtml(fmtDate(o.日期))}</div>
      <div>客户名称（唛头）：${escapeHtml(o.唛头||'')}</div>
      <div>结算币种：${escapeHtml(cur)}</div>
      <div>客户国家/地区：${escapeHtml(o.国家地区||'')}</div>
      <div>出货日期：${escapeHtml(fmtDate(o.出货日期))}</div>
      <div>交货地点：${escapeHtml(o.送货地址||'')}</div>
      <div>付款方式：${escapeHtml(o.付款方式||'')}</div>
    </div>
    <table class="c-tbl"><thead><tr>${colHead}</tr></thead><tbody>${rows||'<tr><td colspan="'+(hide?4:6)+'">暂无明细</td></tr>'}</tbody></table>
    ${finBlock}
    <div class="c-remark">对外备注：${escapeHtml(o.备注||'')}</div>
  </div>`;
  $('printArea').innerHTML=html;
  setTimeout(()=>window.print(),60);
}

/* ============ 全局搜索 ============ */
function doGlobalSearch(q){
  q=(q||'').trim().toLowerCase();
  const el=$('searchResults');
  if(!q){el.innerHTML='<div class="empty">输入关键词搜索唛头 / 订单号 / 款号 / 备注 / 送货地址</div>';return}
  const results={products:[],orders:[],inventory:[],ledger:[],customers:[]};
  DB.products.forEach(p=>{if([p.款号,(p.颜色||[]).map(c=>c.n).join(' '),p.备注].join(' ').toLowerCase().includes(q))results.products.push(p)});
  DB.customers.forEach(c=>{if([c.名称,c.电话,c.地址,c.备注].join(' ').toLowerCase().includes(q))results.customers.push(c)});
  DB.orders.forEach(o=>{if([o.订单号,o.唛头,o.送货地址,o.备注,o.公司单备注].join(' ').toLowerCase().includes(q)||(o.items||[]).some(it=>{const p=productById(it.款号id);return p&&p.款号.toLowerCase().includes(q)}))results.orders.push(o)});
  DB.inventoryLog.forEach(r=>{const p=productById(r.款号id);if([r.颜色,r.尺码,r.仓库,r.经手人,r.备注,p?p.款号:''].join(' ').toLowerCase().includes(q))results.inventory.push(r)});
  DB.ledger.forEach(r=>{if([r.分类,r.对方,r.备注].join(' ').toLowerCase().includes(q))results.ledger.push(r)});
  const total=Object.values(results).reduce((s,a)=>s+a.length,0);
  let html=`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">共找到 ${total} 条结果</div>`;
  if(!total){el.innerHTML=html+'<div class="empty">无匹配</div>';return}
  if(results.customers.length)html+=`<div class="search-cat">客户档案（${results.customers.length}）</div>`+results.customers.map(c=>`<div class="search-item" onclick="openCustomerDetail('${c.id}')"><div class="t">${highlight(c.名称,q)}</div><div class="d">${escapeHtml(c.电话||'')} · ${escapeHtml(c.地址||'')}</div></div>`).join('');
  if(results.products.length)html+=`<div class="search-cat">商品档案（${results.products.length}）</div>`+results.products.map(p=>`<div class="search-item" onclick="jumpTo('products','${p.id}')"><div class="t">${highlight(p.款号,q)}</div><div class="d">工厂价 ¥${num(p.工厂价).toFixed(2)} · 库存 ${p.库存数}</div></div>`).join('');
  if(results.orders.length)html+=`<div class="search-cat">订单（${results.orders.length}）</div>`+results.orders.map(o=>`<div class="search-item" onclick="jumpTo('orders','${o.id}')"><div class="t">${highlight(o.订单号,q)} · ${highlight(o.唛头,q)}</div><div class="d">${fmtDate(o.日期)} · ${money(orderTotal(o),o.币种)} · ${escapeHtml(o.送货地址||'')}</div></div>`).join('');
  if(results.inventory.length)html+=`<div class="search-cat">出入库（${results.inventory.length}）</div>`+results.inventory.map(r=>{const p=productById(r.款号id);return`<div class="search-item" onclick="jumpTo('inventory','${r.id}')"><div class="t">${r.类型==='in'?'入库':'出库'} ${num(r.数量)}件 · ${highlight(p?p.款号:'',q)}</div><div class="d">${fmtDate(r.日期)} · ${escapeHtml(r.颜色)} ${escapeHtml(r.尺码)} · ${escapeHtml(r.仓库)}</div></div>`}).join('');
  if(results.ledger.length)html+=`<div class="search-cat">台账（${results.ledger.length}）</div>`+results.ledger.map(r=>`<div class="search-item" onclick="jumpTo('ledger','${r.id}')"><div class="t">${r.类型==='income'?'收入':'支出'} ${money(r.金额,r.币种)} · ${highlight(r.分类,q)} · ${highlight(r.对方,q)}</div><div class="d">${fmtDate(r.日期)}</div></div>`).join('');
  el.innerHTML=html;
}
function highlight(s,q){s=String(s==null?'':s);const idx=s.toLowerCase().indexOf(q);if(idx<0)return escapeHtml(s);return escapeHtml(s.slice(0,idx))+`<span class="highlight">${escapeHtml(s.slice(idx,idx+q.length))}</span>`+escapeHtml(s.slice(idx+q.length))}
function jumpTo(type,id){switchTab(type);setTimeout(()=>{const map={products:openProductSheet,inventory:openInventorySheet,orders:openOrderSheet,ledger:openLedgerSheet,customers:openCustomerDetail};if(map[type])map[type](id)},100)}

/* ============ Excel 导入 ============ */
function importExcel(input){
  const f=input.files[0];if(!f)return;
  const mode=document.querySelector('input[name=impMode]:checked').value;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const names=wb.SheetNames;
      const preview=$('importPreview');
      const parseSheet=(name)=>{const ws=wb.Sheets[name];if(!ws)return[];return XLSX.utils.sheet_to_json(ws,{defval:''})};
      // 预览
      let html='<div style="font-size:13px;margin-bottom:6px"><b>检测到数据：</b></div><table class="preview-tbl"><thead><tr><th>Sheet</th><th>条数</th></tr></thead><tbody>';
      ['商品档案','客户档案','订单','订单明细','出入库记录','收支台账','装箱单','_meta'].forEach(n=>{const arr=parseSheet(n);if(names.includes(n))html+=`<tr><td>${n}</td><td>${arr.length}</td></tr>`}); /* [NEW] 装箱单 */
      html+='</tbody></table>';
      html+=`<div style="margin-top:10px"><button class="btn btn-success btn-block" onclick="doImport('${mode}')">确认导入（${mode==='merge'?'合并':'覆盖'}）</button></div>`;
      preview.innerHTML=html;
      window._pendingWB=wb;
      toast('已读取，请确认导入');
    }catch(err){toast('导入失败：'+err.message)}
  };
  reader.readAsArrayBuffer(f);
  input.value='';
}
function doImport(mode){
  const wb=window._pendingWB;if(!wb)return toast('无待导入文件');
  const parseSheet=(name)=>{const ws=wb.Sheets[name];if(!ws)return[];return XLSX.utils.sheet_to_json(ws,{defval:''})};
  let newProducts=[],newOrders=[],newItems=[],newInv=[],newLed=[],newCust=[],newCfg=null;
  // 商品
  parseSheet('商品档案').forEach(r=>{
    const id=r.id||uid('p');
    const colors=[];
    const ns=String(r.颜色||'').split('/').filter(Boolean);
    const cs=String(r.颜色值||'').split('/').filter(Boolean);
    ns.forEach((n,i)=>colors.push({n,c:cs[i]||'#cccccc'}));
    newProducts.push({id,款号:r.款号||'',颜色:colors,工厂价:num(r['工厂价(¥)']),零售价:num(r['零售价(¥)']),sizeGroup:r.尺码组类型||'adult',尺码组:String(r.尺码组||'').split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null),库存数:num(r.库存数),autoSync:r.自动联动库存==='是',款式图片:'',备注:r.备注||'',createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt});
  });
  // 客户
  parseSheet('客户档案').forEach(r=>{if(!r.名称)return;newCust.push({id:r.id||uid('c'),名称:r.名称,电话:r.电话||'',地址:r.地址||'',币种:r.币种||'CNY',预付款:num(r.预付款),备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 订单
  parseSheet('订单').forEach(r=>{
    newOrders.push({id:r.id||uid('o'),订单号:r.订单号||'',唛头:r.唛头||'',客户id:r.客户id||'',日期:fmtDate(r.日期),币种:r.币种||'CNY',送货地址:r.送货地址||'',是否公司单:r.公司单==='是',公司单备注:r.公司单备注||'',items:[],运费:num(r.运费),其他费用:num(r.其他费用),备注:r.备注||'',createdAt:r.createdAt||Date.now(),updatedAt:r.updatedAt});
  });
  // 订单明细
  const itemsByOrder={};
  parseSheet('订单明细').forEach(r=>{const oid=r.订单id||newOrders.find(o=>o.订单号===r.订单号)?.id;if(oid){(itemsByOrder[oid]=itemsByOrder[oid]||[]).push({款号id:r.款号id||'',款号快照:r.款号||'',颜色:r.颜色||'',尺码:r.尺码!==''?r.尺码:'',数量:num(r.数量),单价:num(r.单价)})}});
  newOrders.forEach(o=>o.items=itemsByOrder[o.id]||[]);
  // 出入库
  parseSheet('出入库记录').forEach(r=>{newInv.push({id:r.id||uid('i'),日期:fmtDate(r.日期),类型:r.类型==='入库'?'in':'out',款号id:r.款号id||'',款号快照:r.款号||'',颜色:r.颜色||'',尺码:r.尺码!==''?r.尺码:'',数量:num(r.数量),关联订单id:r.关联订单id||'',仓库:r.仓库||'',经手人:r.经手人||'',备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 台账
  parseSheet('收支台账').forEach(r=>{newLed.push({id:r.id||uid('l'),日期:fmtDate(r.日期),类型:r.类型==='收入'?'income':'expense',分类:r.分类||'',金额:num(r.金额),币种:r.币种||'CNY',关联订单id:r.关联订单id||'',客户id:r.客户id||'',对方:r.对方||'',备注:r.备注||'',createdAt:r.createdAt||Date.now()})});
  // 装箱单
  const pkMap={};
  parseSheet('装箱单').forEach(r=>{
    const key=r.id||(r.客户名称+'|'+r.日期+'|'+r.订单号);
    if(!pkMap[key])pkMap[key]={id:r.id||uid('pk'),客户名称:r.客户名称||'',日期:r.日期||todayStr(),订单号:r.订单号||'',关联订单id:r.关联订单id||'',rows:[],createdAt:r.createdAt||Date.now()};
    pkMap[key].rows.push({cn:num(r.C_N)||pkMap[key].rows.length+1,货号:r.货号||'',品名:r.品名||'',件数:num(r.件数),箱数:num(r.箱数),长:r.长||'',宽:r.宽||'',高:r.高||'',单价:num(r.单价),毛重:r.毛重||'',备注:r.备注||''});
  });
  const newPack=Object.values(pkMap);
  // 配置
  const meta=parseSheet('_meta')[0];
  if(meta){const sg=DB.config.sizeGroups;if(meta.尺码组_adult)sg.adult=String(meta.尺码组_adult).split(',').filter(Boolean);if(meta.尺码组_child)sg.child=String(meta.尺码组_child).split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null);if(meta.尺码组_trouser)sg.trouser=String(meta.尺码组_trouser).split(',').map(x=>{const n=parseInt(x);return isNaN(n)?x.trim():n}).filter(x=>x!==''&&x!=null);if(meta.仓库)DB.config.warehouses=String(meta.仓库).split(',').filter(Boolean);if(meta.币种)DB.config.currencies=String(meta.币种).split('|').map(s=>{const[a,b,c]=s.split(',');return{code:a,symbol:b,name:c}}).filter(x=>x.code)}
  // 合并或覆盖
  if(mode==='overwrite'){DB.products=newProducts;DB.orders=newOrders;DB.inventoryLog=newInv;DB.ledger=newLed;DB.customers=newCust;DB.packingLists=newPack} /* [NEW] 装箱单 */
  else{
    const merge=(arr,oldArr,idKey)=>{const ids=new Set(oldArr.map(x=>x.id));arr.forEach(x=>{if(!ids.has(x.id))oldArr.push(x);else{const t=oldArr.find(o=>o.id===x.id);Object.assign(t,x)}})};
    merge(newProducts,DB.products);merge(newOrders,DB.orders);merge(newInv,DB.inventoryLog);merge(newLed,DB.ledger);merge(newCust,DB.customers);merge(newPack,DB.packingLists); /* [NEW] 装箱单 */
    // 明细合并到订单
    newOrders.forEach(o=>{const t=orderById(o.id);if(t)t.items=o.items});
  }
  save();renderAll();
  $('importPreview').innerHTML='<div style="color:var(--green);font-size:13px">✅ 导入完成：'+newProducts.length+' 商品 / '+newOrders.length+' 订单 / '+newInv.length+' 出入库 / '+newLed.length+' 台账 / '+newCust.length+' 客户 / '+newPack.length+' 装箱单</div>'; /* [NEW] */
  toast('导入成功');
  window._pendingWB=null;
}

function pf(v){return num(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function newPackRow(cn,ov){return Object.assign({cn:cn||1,货号:'',品名:'',件数:0,箱数:0,长:'',宽:'',高:'',单价:0,毛重:'',备注:''},ov||{})}
function renderPacking(){
  const el=$('packingList');
  if(!DB.packingLists.length){el.innerHTML='<div class="empty" style="padding:30px"><div>暂无装箱单，点击右下角"＋"新建</div></div>';return}
  const sorted=[...DB.packingLists].sort((a,b)=>(b.日期||'').localeCompare(a.日期||''));
  el.innerHTML=sorted.map(p=>{
    const total=(p.rows||[]).reduce((s,r)=>s+num(r.件数)*num(r.箱数)*num(r.单价),0);

function packRowsHTML(){

      <td id="pk_amt_${i}">${pf(num(r.件数)*num(r.箱数)*num(r.单价))}</td>

      <td><input id="pk_高_${i}" value="${escapeHtml(r.高||'')}" style="width:46px" oninput="onPackField(${i},'高',this.value)"></td>

  return head+'<tbody>'+body+'</tbody>'+itemList;

function onPackField(i,key,val){
  const r=window._packRows[i];if(!r)return;
  if(key==='件数'||key==='箱数'||key==='单价')r[key]=num(val);else if(key==='cn')r.cn=num(val);else r[key]=val;
  if(key==='货号'){
    const g=DB.orders.flatMap(o=>o.styles||[]).find(x=>(x.款号||x.款号快照||'')===String(val).trim());
    if(g){if(!r.品名){r.品名=g.品名||(g.款号||g.款号快照||'');const e=$('pk_品名_'+i);if(e)e.value=r.品名;}if(!num(r.单价)){r.单价=num(g.单价);const e=$('pk_单价_'+i);if(e)e.value=r.单价;updatePackingRow(i);return;}}
  }
  if(key==='件数'||key==='箱数'||key==='单价')updatePackingRow(i);
}
function updatePackingRow(i){
  const r=window._packRows[i];if(!r)return;
  const ttl=num(r.件数)*num(r.箱数);const amt=ttl*num(r.单价);
  const ttlEl=$('pk_ttl_'+i);if(ttlEl)ttlEl.textContent=ttl;
  const amtEl=$('pk_amt_'+i);if(amtEl)amtEl.textContent=pf(amt);
  updatePackingTotal();
}
function updatePackingTotal(){
  const total=(window._packRows||[]).reduce((s,r)=>s+num(r.件数)*num(r.箱数)*num(r.单价),0);
  const el=$('pkTotal');if(el)el.textContent='金额合计 Total Amount：'+pf(total);
}
function addPackingRow(){const next=(window._packRows||[]).length?Math.max(...window._packRows.map(r=>num(r.cn)||0))+1:1;window._packRows.push(newPackRow(next));rerenderPackingTable();}
function rmPackingRow(i){window._packRows.splice(i,1);rerenderPackingTable();}
function rerenderPackingTable(){const t=$('pkTable');if(t)t.innerHTML=packRowsHTML();updatePackingTotal();} /* 加/删行整体重渲，字段编辑走 updatePackingRow 不重建 */
function linkPackingOrder(){
  const oid=$('pk_关联订单id').value;if(!oid)return;
  const o=orderById(oid);if(!o)return;
  if(!$('pk_客户名称').value)$('pk_客户名称').value=o.唛头||'';
  if(!$('pk_日期').value)$('pk_日期').value=fmtDate(o.日期);
  $('pk_订单号').value=o.订单号||'';
  const groups=o.styles?cloneGroups(o.styles):groupFlatItems(o.items);
  window._packRows=groups.map((g,idx)=>{const p=g.款号id?productById(g.款号id):null;const 品名=g.品名||(p?p.款号:g.款号快照)||g.款号||'';return newPackRow(idx+1,{货号:g.款号||g.款号快照||'',品名,单价:g.单价});});
  if(!window._packRows.length)window._packRows=[newPackRow(1)];
  rerenderPackingTable();
}
function savePacking(id){
  const 客户名称=$('pk_客户名称').value.trim();if(!客户名称)return toast('客户名称必填');
  const data={客户名称,日期:$('pk_日期').value||todayStr(),订单号:$('pk_订单号').value.trim(),关联订单id:$('pk_关联订单id').value,rows:cloneGroups(window._packRows||[])};
  data.rows.forEach((r,i)=>r.cn=i+1); /* C/N 连续自增 */
  if(id){const t=DB.packingLists.find(x=>x.id===id);Object.assign(t,data);t.updatedAt=Date.now();}else{data.id=uid('pk');data.createdAt=Date.now();DB.packingLists.push(data);}
  save();renderPacking();closeSheet();toast('已保存');
}
function printPacking(id){
  let p;
  if(id){p=DB.packingLists.find(x=>x.id===id);if(!p)return toast('装箱单不存在');}
  else{p={客户名称:$('pk_客户名称').value.trim(),日期:$('pk_日期').value,订单号:$('pk_订单号').value.trim(),rows:cloneGroups(window._packRows||[])};if(!p.客户名称)toast('提示：按当前未保存内容生成预览');}
  renderPackingPreview(p);
}
function renderPackingPreview(p){
  const rows=(p.rows||[]).map((r,i)=>`<tr>
    <td>${num(r.cn)||(i+1)}</td><td>${escapeHtml(r.货号||'')}</td><td>${escapeHtml(r.品名||'')}</td>
    <td>${num(r.件数)}</td><td>${num(r.箱数)}</td><td>${num(r.件数)*num(r.箱数)}</td>
    <td>${pf(num(r.单价))}</td><td>${pf(num(r.件数)*num(r.箱数)*num(r.单价))}</td>
    <td>${escapeHtml(r.长||'')}</td><td>${escapeHtml(r.宽||'')}</td><td>${escapeHtml(r.高||'')}</td>
    <td>${escapeHtml(r.毛重||'')}</td><td>${escapeHtml(r.备注||'')}</td>
  </tr>`).join('');
  const total=(p.rows||[]).reduce((s,r)=>s+num(r.件数)*num(r.箱数)*num(r.单价),0);
  const html=`<div class="packlist">
    <h1>PACKINGLIST</h1>
    <div class="pl-head">
      <div>Customer：${escapeHtml(p.客户名称||'')}</div><div>Date：${escapeHtml(fmtDate(p.日期))}</div>
      <div>Order No：${escapeHtml(p.订单号||'')}</div><div></div>
    </div>
    <table class="pl-tbl"><thead><tr>
      <th>C/N No</th><th>Item No 货号</th><th>Description 品名</th><th>PCS 件数</th><th>CTN 箱数</th><th>TTL/QTY 总数量</th><th>U/Price 单价</th><th>Amount 总金额</th><th>Meas 长</th><th>宽</th><th>高</th><th>gw/kgs 毛重</th><th>Remark 备注</th>
    </tr></thead><tbody>${rows||'<tr><td colspan="13">暂无明细</td></tr>'}</tbody></table>
    <div class="pl-total">金额合计 Total Amount：${pf(total)}</div>
  </div>`;
  $('printArea').innerHTML=html;
  setTimeout(()=>window.print(),60);
}

/* ============ sheet 弹层 ============ */
function openSheet(title,bodyHTML,btnLabel,onSave,opts){
  opts=opts||{};
  $('sheetTitle').textContent=title;
  $('sheetBody').innerHTML=bodyHTML;
  let footHTML=`<button class="btn btn-block" onclick="closeSheet()">取消</button>`;
  if(onSave)footHTML=`<button class="btn btn-primary btn-block" id="sheetSave">${btnLabel||'保存'}</button><button class="btn btn-block" onclick="closeSheet()">取消</button>`;
  if(opts.deleteId)footHTML=`<button class="btn btn-danger" onclick="deleteRow('${opts.deleteType}','${opts.deleteId}')">删除</button>`+footHTML;
  $('sheetFoot').innerHTML=footHTML;
  if(onSave)$('sheetSave').onclick=()=>{try{onSave()}catch(e){toast('错误：'+e.message);console.error(e)}};
  $('sheetMask').classList.add('show');
  document.body.style.overflow='hidden';
}
function closeSheet(){$('sheetMask').classList.remove('show');document.body.style.overflow='';window._curColors=null;window._orderItems=null;window._orderGroups=null;window._curLedgerType=null}
$('sheetMask').onclick=e=>{if(e.target===$('sheetMask'))closeSheet()};
function deleteRow(type,id){if(!confirm('确定删除？'))return;if(type==='product'){DB.products=DB.products.filter(x=>x.id!==id);save();renderProducts()}if(type==='customer')deleteCustomer(id);if(type==='inventory')deleteInventory(id);if(type==='order')deleteOrder(id);if(type==='ledger')deleteLedger(id);closeSheet()}

/* 给商品/出入库/订单/台账编辑弹层注入删除按钮 */
window.openProductSheet = function(id){_origOpenProductSheet(id);if(id){$('sheetFoot').insertAdjacentHTML('afterbegin',`<button class="btn btn-danger" onclick="deleteRow('product','${id}')">删除</button>`)}}
window.openInventorySheet = function(id){_origOpenInventorySheet(id);if(id){$('sheetFoot').insertAdjacentHTML('afterbegin',`<button class="btn btn-danger" onclick="deleteRow('inventory','${id}')">删除</button>`)}}
window.openOrderSheet = function(id){_origOpenOrderSheet(id);if(id){$('sheetFoot').insertAdjacentHTML('afterbegin',`<button class="btn btn-danger" onclick="deleteRow('order','${id}')">删除</button>`)}}
window.openLedgerSheet = function(id){_origOpenLedgerSheet(id);if(id){$('sheetFoot').insertAdjacentHTML('afterbegin',`<button class="btn btn-danger" onclick="deleteRow('ledger','${id}')">删除</button>`)}}
window.openCustomerSheet = function(id){_origOpenCustomerSheet(id);if(id){$('sheetFoot').insertAdjacentHTML('afterbegin',`<button class="btn btn-danger" onclick="deleteRow('customer','${id}')">删除</button>`)}}
